function linkify(text){
  const re=/(https?:\/\/[^\s]+|www\.[^\s]+)/g;let out='',last=0,m;
  while((m=re.exec(text))){
    out+=esc(text.slice(last,m.index));
    let url=m[0],trail='';const tm=url.match(/[).,;!?]+$/);
    if(tm){trail=url.slice(url.length-tm[0].length);url=url.slice(0,url.length-tm[0].length);}
    const href=url.startsWith('www.')?'https://'+url:url;
    out+='<a class="mlink" href="'+esc(href)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(url)+'</a>'+esc(trail);
    last=m.index+m[0].length;
  }
  out+=esc(text.slice(last));return out;
}

  r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('img'))db.createObjectStore('img')};
  r.onsuccess=()=>{IMG_DB=r.result;res(IMG_DB)};r.onerror=()=>rej(r.error);});}
function idbStore(mode){return idbOpen().then(db=>db.transaction('img',mode).objectStore('img'))}
function idbReq(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function idbPut(key,blob){return idbStore('readwrite').then(st=>idbReq(st.put(blob,key)))}
function idbDel(key){return idbStore('readwrite').then(st=>idbReq(st.delete(key)))}
function idbAll(){return idbStore('readonly').then(st=>Promise.all([idbReq(st.getAllKeys()),idbReq(st.getAll())]).then(([ks,vs])=>{const o={};ks.forEach((k,i)=>o[k]=vs[i]);return o}))}
function initImgs(){return idbAll().then(m=>{Object.keys(m).forEach(k=>{if(m[k])IMG_URLS[k]=URL.createObjectURL(m[k])})}).catch(()=>{})}
function readImageBlob(file,cb){
  const rd=new FileReader();
  rd.onload=e=>{const img=new Image();img.onload=()=>{
    const MAX=1000;let w=img.width,h=img.height;
    if(w>MAX||h>MAX){const r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r)}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    c.toBlob(b=>cb(b),'image/jpeg',0.72);
  };img.onerror=()=>alert('Nie udało się wczytać zdjęcia.');img.src=e.target.result;};
  rd.readAsDataURL(file);
}

}

  const txt=PHRASE_JP[i];if(!txt)return;

function daysUntil(dateStr){const d=new Date(dateStr+'T00:00:00'),t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000)}
function relText(diff){if(diff>1)return{t:'za '+diff+' dni',c:''};if(diff===1)return{t:'jutro',c:'cd-soon'};if(diff===0)return{t:'dziś',c:'cd-soon'};return{t:'minęło '+(-diff)+' dni',c:'cd-past'}}

// Zegar: pokazuje czas w Tokio (dla urządzeń spoza Japonii) albo w Polsce (dla urządzeń w japońskiej strefie)
function renderTzClock(){
  const el=document.getElementById('tzClock');
  if(!el)return;
  const now=new Date();
  const localTz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  const isJapanDevice=localTz==='Asia/Tokyo'||(-now.getTimezoneOffset())===540;
  const targetTz=isJapanDevice?'Europe/Warsaw':'Asia/Tokyo';
  const flag=isJapanDevice?'🇵🇱':'🇯🇵';
  const time=new Intl.DateTimeFormat('pl-PL',{timeZone:targetTz,hour:'2-digit',minute:'2-digit',hour12:false}).format(now);
  const targetDate=new Intl.DateTimeFormat('pl-PL',{timeZone:targetTz,day:'2-digit',month:'2-digit'}).format(now);
  const localDate=new Intl.DateTimeFormat('pl-PL',{day:'2-digit',month:'2-digit'}).format(now);
  el.textContent=flag+' '+time+(targetDate===localDate?'':' · '+targetDate);
  el.title=(isJapanDevice?'Aktualny czas w Polsce':'Aktualny czas w Tokio')+(targetDate===localDate?'':' (inny dzień niż lokalnie)');
}
renderTzClock();
setInterval(renderTzClock,30000);

function tripDayNum(){

  const n=Math.round((new Date(jp.d+'T00:00:00Z')-new Date(dayDate(0)+'T00:00:00Z'))/86400000);

}

  const pill=ensureNowPill();

  const cur=tzParts((n===0||n===21)?'Europe/Warsaw':'Asia/Tokyo');
  if(!cur){off();return}
  const rows=[...dc.querySelectorAll('.sr')].map(el=>{const m=(el.dataset.tm||'').match(/^(\d{1,2}):(\d{2})/);return m?{el,min:+m[1]*60+ +m[2]}:null}).filter(Boolean);
  let curRow=null,nextRow=null;
  rows.forEach(r=>{if(r.min<=cur.min)curRow=r;else if(!nextRow)nextRow=r});
  rows.forEach(r=>{if(curRow&&r.min<curRow.min)r.el.classList.add('sr-past')});

  let nt='';

  const npn=pill.querySelector('.np-n');npn.textContent=nt;npn.style.display=nt?'':'none';
  pill._target=curRow?curRow.el:dc;

// ── Pogoda: Open-Meteo (bez klucza), jedno zapytanie o wszystkie lokalizacje, cache 3h ──
function fetchWx(){
  if(!navigator.onLine)return;
  const c=getWxCache();
  if(c.ts&&Date.now()-c.ts<3*3600*1000)return;
  if(!D.meta.start)return;
  const jp=tzParts('Asia/Tokyo');if(!jp)return;
  const addD=(ds,k)=>{const t=new Date(ds+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+k);return t.toISOString().slice(0,10)};
  const start=dayDate(1)>jp.d?dayDate(1):jp.d;
  const horizon=addD(jp.d,15);
  const end=dayDate(20)<horizon?dayDate(20):horizon;
  if(start>end)return; // poza 16-dniowym horyzontem prognozy albo po podróży
  const coords=[],idx={};
  for(let n=1;n<=20;n++){const g=DAY_GEO[n];if(!g)continue;const k=g.join(',');if(!(k in idx)){idx[k]=coords.length;coords.push(g)}}
  const url='https://api.open-meteo.com/v1/forecast?latitude='+coords.map(c=>c[0]).join(',')+'&longitude='+coords.map(c=>c[1]).join(',')+'&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&start_date='+start+'&end_date='+end;
  fetch(url).then(r=>r.json()).then(j=>{
    const arr=Array.isArray(j)?j:[j];
    const byDay={};
    for(let n=1;n<=20;n++){
      const g=DAY_GEO[n];if(!g)continue;
      const loc=arr[idx[g.join(',')]];
      if(!loc||!loc.daily||!loc.daily.time)continue;
      const di=loc.daily.time.indexOf(dayDate(n));
      if(di<0)continue;
      byDay[n]={tx:loc.daily.temperature_2m_max[di],tn:loc.daily.temperature_2m_min[di],pp:loc.daily.precipitation_probability_max[di]};
    }
    if(Object.keys(byDay).length){
      try{localStorage.setItem('jp26_wx',JSON.stringify({ts:Date.now(),d:byDay}))}catch(e){}
      renderPlanTab();
    }
  }).catch(()=>{});
}
fetchWx();
setInterval(fetchWx,30*60*1000);
