### JEDZENIE
Kioto / Osaka :: Takoyaki | Kulki z ciasta naleśnikowego z kawałkiem ośmiornicy w środku, polane gęstym brązowym sosem, majonezem i posypane wiórkami katsuobushi (suszony bonito), które „tańczą" od gorąca. Wynalazek z 1935 roku — Endo Tomekichi z Osaki przerobił wcześniejsze „radioyaki" (z wołowiną), wrzucając ośmiornicę zamiast mięsa. Gotowane w specjalnej patelni z półkulistymi wgłębieniami, obracane szpikulcami w kilka sekund. Dōtonbori to epicentrum — stoiska co kilka metrów. Jedzcie gorące, ale uważajcie: środek parzy!
Kioto / Osaka :: Okonomiyaki | Dosłownie „co lubisz, grillowane" — gruby naleśnik z ciasta, kapusty, jajek i dowolnych dodatków (wieprzowina, krewetki, ser, mochi), smażony na teppanie (gorącej płycie) przy waszym stoliku. Osaka-style: wszystko wymieszane w misce i wylane na grill. W Hiroshimie warstwy się nakłada — ale tu nie jesteście w Hiroshimie, więc mieszajcie! Sami go obracacie szpatułką (kote). Na koniec sos, majonez, bonito, aonori (zielone wodorosty). Powstał w latach 30. XX w. jako tanie jedzenie uliczne — „jednogarnkowy posiłek" z wszystkiego, co było pod ręką.
Kioto / Osaka :: Kushikatsu | Smażone na głębokim tłuszczu szpadki z mięsem, warzywami, serem, a nawet bananami — panierowane i chrupiące. Shinsekai (dzielnica w Osace) to kolebka kushikatsu od lat 30. XX w. Żelazna zasada: NIE MACZAĆ DRUGI RAZ w sosie (二度づけ禁止 — nidodzuke kinshi)! Sos jest wspólny, więc po ugryzieniu używacie łyżki do nabierania. Lokale mają to wypisane na ścianach wielkimi literami. Zamawiacie set albo po sztuce — jedną szpadkę zjadacie w 1–2 kęsach.
Kioto / Osaka :: Yudofu | Jedwabiste tofu gotowane w lekkim dashi z wodorostami kombu — brzmi prosto, ale to esencja zen. Wywodzi się z kuchni mnichów buddyjskich z Kioto, którzy nie jedli mięsa. Higashiyama (okolice Nanzen-ji) to historyczne centrum yudofu — restauracje serwują je od pokoleń. Podawane z sosem ponzu, świeżo tartym imbirem i szczypiorkiem. Smak jest subtelny — to danie o teksturze i prostocie, nie o wyrazistości.
Kioto / Osaka :: Matcha (lody / parfait) | Matcha to sproszkowana zielona herbata — nie parzona, a ubijana bambusową miotełką (chasen) w miseczce. Najlepsza pochodzi z Uji koło Kioto, gdzie uprawia się ją od XIII w. W Gion i Uji dostaniecie matcha w każdej formie: lody, parfait, ciasta, tiramisu, nawet soba. Prawdziwa ceremonijna matcha jest gorzka i intensywna — desery są słodsze. Im zieleńszy kolor, tym wyższa jakość. Kupcie puszkę proszku „ceremonial grade" w Uji — starczy na miesiące.
Kioto / Osaka :: Kaiseki | Wielodaniowa uczta wywodząca się z herbacianej ceremonii — 7–14 miniaturowych dań podawanych w ściśle określonej kolejności: sakizuke (przystawka), owan (zupa), sashimi, yakimono (z grilla), nimono (duszone), gohan (ryż), deser. Każde danie odzwierciedla porę roku — w sierpniu spodziewajcie się ryb rzecznych, bakłażana, myōga (japoński imbir) i przezroczystych deserów imitujących wodę. Naczynia są częścią sztuki — dobrane do pory roku, jedzenia i estetyki. Drogo (~5 000–15 000 ¥/os.), ale to kulinarne doświadczenie życia.
Nara / Uji :: Ramen Menya Inoichi #3 | Mała ramenownia w Uji specjalizująca się w dashi ramen — lekki, czysty bulion na bazie ryb i wodorostów zamiast ciężkiej wieprzowej tonkotsu. Delikatny smak morski, idealne cienkie noodle, plaster chāshū na wierzchu. Świetna opcja na lżejszy ramen w upalny dzień. Uji nie jest znane z ramenu (to królestwo herbaty), więc ta knajpka to lokalny sekret.
Nara / Uji :: Matcha z Uji | Uji to stolica matcha w Japonii — herbatę uprawia się tu od 1191, gdy mnich Myōan Eisai przywiózł nasiona z Chin. Tajemnica jakości: pola przykrywa się czarnymi siatkami 3 tygodnie przed zbiorami, co wymusza produkcję chlorofilu (stąd intensywna zieleń). W sklepach jak Nakamura Tokichi (od 1859) kupicie proszek „ceremonial grade" za ułamek ceny europejskiej. Pro tip: kupcie dużo na prezenty — matcha z Uji to najlepszy jadalny souvenir z Japonii.
Nara / Uji :: Mochi / wagashi | Mochi to kleiste ciasto ryżowe ubijane drewnianymi młotami (mochitsuki) — tradycja z tysięcy lat. Wagashi to artystyczne słodycze do herbaty: nerikiri (rzeźbione z fasoli azuki), yōkan (galaretka), daifuku (mochi z nadzieniem). W sierpniu szukajcie mizu-yōkan (przezroczysta galaretka chłodząca wzrok) i warabi-mochi (z paprociowego skrobi, posypane kinako). Każdy kształt i kolor nawiązuje do pory roku — cukiernik nigdy nie poda wiosennego wzoru latem.
Kanazawa :: Sushi i owoce morza | Kanazawa leży nad Morzem Japońskim — zimne, głębokie wody dają jedne z najlepszych owoców morza w Japonii. Na targu Ōmichō (od 1721!) spróbujcie: nodoguro (czarny okoń — „toro wśród białych ryb," tłusty i maślany), buri (yellowtail), amaebi (słodkie krewetki jedzone na surowo), i uni (jeżowiec). Sushi w Kanazawie jest tańsze i świeższe niż w Tokio — ryba łapana rano, na talerzu w południe. Kanazawa rywalizuje z Toyamą o tytuł najlepszego sushi poza Tokio.
Kanazawa :: Donburi z owocami morza / kraby | Kaisen-don to miska ryżu z ułożonymi na wierzchu plastrami surowej ryby, krewetek, ikry i jajka — jak sashimi na ryżu. Na Ōmichō zamawiacie przy ladzie i jecie na stojąco lub na ławce. Specjalność Kanazawy: miska z krabem śnieżnym (zuwaigani) — słodkie, delikatne mięso. Sezon na kraby to zima (XI–III), ale latem dostaniecie mrożone nóżki i inne owoce morza w szczytowej formie. Donburi to szybki, sycący posiłek — idealny na targu.
Takayama :: Wołowina Hida | Marmurkowata wołowina z bydła Japanese Black hodowanego w alpejskim klimacie prefektury Gifu. Ten sam poziom jakości co legendarny Kobe beef (BMS 5+), ale mniej znana za granicą — a więc tańsza! Krowy karmione lokalnym ziarnem, pojone górską wodą. Najlepiej smakuje z grilla na węglu (yakiniku) lub jako steak serwowany na gorącym kamieniu (ishiyaki). Na targu Miyagawa sprzedają sushi z wołowiną Hida za ~700 ¥/szt. — dwa kęsy, które zapamiętacie. Szukajcie certyfikatu z brązową figurką krowy — potwierdza autentyczność.
Takayama :: Hoba miso | Pasta miso z grzybami leśnymi, szczypiorkiem i wołowiną, grillowana na suszonym liściu magnolii (hoba) nad żarem. Specjalność Takayamy z epoki Edo — zimą górale jedli gorącą papkę miso na liściu jako rozgrzewkę. Liść hoba jest naturalnie antybakteryjny i nadaje daniu lekki, drewniany aromat. Podawane z ryżem — rozbijasz żółtko na miso, mieszasz i jesz prosto z liścia. Serwowane jako część śniadania w ryokanach lub na kolację.
Takayama :: Takayama ramen | Cienkie, kręcone noodle w lekkim, przejrzystym bulionie sojowym (shōyu) — prosty, czysty smak, zupełnie inny od ciężkiego tonkotsu. Takayama chūka soba (stara nazwa ramenu) jest tu od lat 30. XX w. Bulion gotowany godzinami z kurczaka i warzyw, doprawiony lokalnym sosem sojowym. Charakterystyka: noodle kręcone (nie proste), tłuszcz wieprzowy na powierzchni (rozgrzewa w górskim klimacie), plasterki chāshū i szczypiorek. Zimą to rozgrzewka, latem — zaskakująco orzeźwiający.
Takayama :: Mitarashi dango | Trzy lub pięć kulek z ciasta ryżowego na szpadce, grillowane na węglu i polane słodko-słonym sosem sojowym (tare). Nazwa pochodzi od strumienia Mitarashi przy świątyni Shimogamo w Kioto, gdzie pielgrzymi jedli je od wieków. W Takayamie na targu Miyagawa dostaniecie je prosto z grilla — chrupiące z zewnątrz, ciągnące się w środku. Prosty, genialny street food za ~100–200 ¥. Najlepsze gorące, kiedy tare jeszcze się lśni.
Togakushi / Nagano :: Togakushi soba | Jeden z „Trzech Wielkich Regionów Soba" w Japonii (obok Izumo i Wanko). Gryczane noodle z mąki mielonej tuż przed użyciem, podawane na bambusowych koszyczkach — styl „bocchi" (porcje garściami, po 5 na koszyczku). Zimna woda z gór Togakushi i alpejski klimat dają mące intensywny, orzechowy smak. Zamówcie „jūwari soba" (100% gryki, zero pszenicy) — smak czysty i wyrazisty. Makaron maczacie w zimnym sosie tsuyu z wasabi i szczypiorkiem. Tradycja sięga XVII w., kiedy mnisi z tutejszych świątyń zaczęli serwować sobę pielgrzymom.
Togakushi / Nagano :: Oyaki | Pieczone lub parowane pierożki z ciasta gryczanego lub pszennego z nadzieniem warzywnym — najczęściej nozawana (kiszone liście rzepy), bakłażan z miso, dynia, lub grzyby. Specjalność Nagano od pokoleń — chłopskie jedzenie z gór, robione z tego, co było pod ręką. Najlepsze prosto z pieca na ulicy, chrupiące z zewnątrz i soczyste w środku. W Nagano miasto sprzedaje je dosłownie wszędzie: przy Zenkō-ji, na stacji, w konbini. Smak zmienia się z porą roku — latem bakłażan, jesienią grzyby.
Togakushi / Nagano :: Kasztany / Mont Blanc | Obuse to stolica kasztanów w Japonii — hodowla od XIV w., dawniej kasztany wysyłano jako daninę dla szoguna. Lokalna ziemia (dawne koryto rzeki) daje wyjątkowo słodkie, duże owoce. Mont Blanc w Obuse to deser z „nitek" kasztanowego puree ułożonych na kremie — inny niż europejski odpowiednik: mniej słodki, bardziej orzechowy. Spróbujcie też kurigohan (ryż gotowany z kasztanami) i kuri-kanoko (kasztany w galaretce). Obuse-do i Sakuraikohjien walczą o tytuł najlepszego — spróbujcie obu.
Togakushi / Nagano :: Basashi | Sashimi z surowej koniny — cienkie, bordowe plastry podawane z tartym imbirem, czosnkiem i sosem sojowym. Nagano (obok Kumamoto na Kyūshū) to jeden z dwóch głównych regionów basashi w Japonii. Tradycja sięga epoki samurajów, gdy koń był źródłem białka w górach. Smak: delikatny, lekko słodki, zaskakująco miękki — bardziej przypomina tuńczyka niż wołowinę. Nie musicie — ale jeśli ktoś z was jest odważny, to jedno z najbardziej unikalnych doświadczeń kulinarnych podróży.
Tokio :: Monja-yaki | Tokijska odpowiedź na okonomiyaki z Osaki, ale zupełnie inna konsystencja — rzadkie ciasto wylewa się na teppan i robi się ciągnące, skwierczące i chrupiące na brzegach. Jecie małymi szpatułkami (hagashi) prosto z grilla, skrobiąc przysmażone kawałki. Narodziło się w Tsukishimie (dzielnica obok Asakusy, „Monja Street" ma ~70 lokali), ale dostaniecie je też w Asakusie. Smak: intensywny, słony, z serem, mentaiko (ikra dorsza) lub mochi. Wygląda nieapetycznie — smakuje rewelacyjnie.
Tokio :: Ekiben | Ekiben (駅弁 = stacja + bento) to lunchboxy sprzedawane na stacjach kolejowych — każdy region Japonii ma swoją specjalność. Na stacji Nagano szukajcie: shinshu soba bento, oyaki bento lub kuri-gohan bento (kasztany z Obuse). Tradycja sięga 1885 roku (stacja Utsunomiya — dwa onigiri z takuanem za 5 senów). Dziś to sztuka: piękne pudełka, regionalne składniki, sezonowe menu. Jedzenie ekiben w Shinkansenie z widokiem za oknem to rytuał japońskiej podróży — nie pomijajcie go.
Tokio :: Ichiran ramen | Sieć ramenowa z Fukuoki, słynna z „indywidualnych kabin" (aji shūchū counter — „pulpit skupienia na smaku"): siedzicie za bambusową zasłoną, wypełniacie kwestionariusz preferencji (twardość noodle, ilość czosnku, pikantność, gęstość bulionu) i dostajacie miskę przez okienko bez kontaktu wzrokowego z kucharzem. Tonkotsu (wieprzowy) bulion jest gęsty, kremowy i bogaty. Wymyślony w 1960 jako eksperyment w „pozbawionej dystrakcji konsumpcji ramenu." Idealne dla introwertyków i dla każdego po długim dniu.
Tokio :: Sushi (omakase / kaiten) | Omakase (お任せ = „zdaję się na pana") to format, w którym szef kuchni sam wybiera co podać — kawałek po kawałku, prosto z deski. Kaiten-zushi to sushi na obrotowej taśmie — weselsze i tańsze, zamawiacie z tabletu. Na pożegnalną kolację polecam coś pomiędzy: przyzwoitą sushi-ya przy ladzie z szefem, który pyta „jeszcze?" — nie omakase za 30 000 ¥, ale też nie taśma. Tokio jest stolicą sushi — tu Jiro Ono (z filmu „Jiro Dreams of Sushi") dostał trzy gwiazdki Michelin za lokal na stacji metra.
Tokio :: Kare-pan (curry bread) | Smażony w głębokim tłuszczu chlebek nadziewany japońskim curry — chrupiący z zewnątrz, gęste curry z rozpuszczonym serem w środku. Japoński wynalazek z lat 20. XX w. — piekarnia Cattlea w Tokio twierdzi, że wymyśliła go w 1927, wzorując się na europejskich pączkach. Dziś kare-pan jest w każdej piekarni i konbini, ale świeżo smażony to inny level. CEL: Giraffa Asakusa (浅草2-3-26, 11:00–18:00) — specjalistyczny sklep z kare-panem, złoto na Curry Bread Grand Prix 3 lata z rzędu. 30 przypraw w cieście, ser ciągnący się jak mozzarella. Idealnie wpada po Senso-ji, przed lunchem w Dniu 14.
Tokio :: Shirasu-don | Miska ryżu pokryta górą malutkich białych rybek (shirasu — larwy sardynek/sardeli). W Kamakurze i Enoshimie to specjalność — rybacy łowią je rano, na talerzu są w południe. Dostępne jako nama-shirasu (surowe — przezroczyste, delikatne) lub kamaage (ugotowane — białe, bardziej wyraziste). Surowe dostępne tylko gdy połów się udał — pytajcie „nama arimasu ka?" Sezon: marzec–grudzień, ale latem bywa przerwa. Smak morza w czystej postaci, z odrobiną sosu sojowego i imbirem.
Automaty (jihanki) :: Pocari Sweat / Aquarius | Izotoniki — ratunek w sierpniowym upale (35°C + wilgotność!). Pocari Sweat (Otsuka, 1980) to japońska odpowiedź na Gatorade: lekko słony, cytrusowy, orzeźwiający. Nazwa „Sweat" brzmi dziwnie po angielsku, ale w Japonii kojarzy się ze sportem i zdrowym potem. Aquarius (Coca-Cola Japan) jest lżejszy. Oba w każdym automacie za ~160 ¥. Pijcie 1–2 dziennie — naprawdę ratują w upale. W Japonii jest ~5 milionów automatów z napojami — jeden na ~23 osoby, najwyższa gęstość na świecie.
Automaty (jihanki) :: Kawa w puszce (BOSS, Georgia) | Japonia wymyśliła kawę w puszce w 1969 (UCC). Marka BOSS (Suntory) ma twarz Humphreya Bogarta i jest kultowa — Tommy Lee Jones nagrał ponad 80 reklam BOSS jako kosmita badający japońską kulturę pracy. Georgia (Coca-Cola) to najpopularniejsza. Ten sam automat podaje gorące (czerwona etykieta) i zimne (niebieska) puszki obok siebie — dwie temperatury z jednej maszyny. Black (bez cukru), Latte, Café au Lait — pijecie to na ulicy o 7 rano i czujecie się jak salaryman. ~130 ¥.
Automaty (jihanki) :: Oi Ocha / Iyemon | Zielona herbata bez cukru — to DOMYŚLNY napój Japonii (nie woda, nie cola). Oi Ocha (Itoen, „hej, herbato!") i Iyemon (Suntory, nazwany od słynnego producenta herbaty z Uji z XVIII w.) smakują jak świeżo zaparzona sencha — gorzkawo, roślinnie, orzeźwiająco. UWAGA na etykiety: zielona = niesłodzona (to ta), brązowa = hōjicha (prażona, też dobra), ale niektóre mają drobny napis „sweetened" — sprawdźcie. Japończycy piją ją do wszystkiego — do sushi, do bentu, do onigiri. Po tygodniu wy też będziecie.
Automaty (jihanki) :: Calpico (Calpis) | Mleczno-cytrusowy napój gazowany o lekko jogurtowym posmaku — smak trudny do opisania, ale natychmiast uzależniający. Wymyślony w 1919 po podróży założyciela Kaiun Mishimy do Mongolii, gdzie pił kumys (fermentowane mleko klaczy). Nazwa „Calpis" (Cal od calcium + pis od sanskryckiego sarpis = masło) brzmi niefortunnie po angielsku, stąd eksportowa nazwa „Calpico." W automacie szukajcie niebiesko-białej puszki z kropkami. Istnieje wersja z wodą i z sodą — soda jest lepsza w upale.
Automaty (jihanki) :: Gogo no Kōcha | „Popołudniowa herbata" (午後の紅茶) od Kirin — słodka herbata z mlekiem (royal milk tea) w plastikowej butelce. Japonia jest jednym z największych konsumentów herbaty mlecznej w Azji Wschodniej. Gogo no Kōcha istnieje od 1986 i jest w KAŻDYM automacie. Trzy warianty: straight (bez mleka, niesłodka), lemon tea, milk tea (ta najpopularniesza — złota etykieta). Zimna milk tea w upalne popołudnie to błogość. Alternatywa: Lipton Royal Milk Tea w puszce — gęstsza i bardziej kremowa.
Automaty (jihanki) :: Ramune | Napój gazowany w butelce zamkniętej szklaną kulką (biidama) zamiast kapsla — wciskacie plastikowy popychacz, kulka wpada do szyjki i napój syczy. Dzieci to uwielbiają! Wynaleziony w 1884 w Kobe przez Szkota Alexandra Camerona Sima — wzorowany na brytyjskim Codd-neck bottle. Smak: cytrynowo-limonkowy, intensywnie gazowany, lekko sztuczny — ale chodzi o doświadczenie, nie smak. Klasyk japońskich festiwali (matsuri) i letnich wspomnień. Kupcie na stoisku yatai — smakuje lepiej z plastikiem pod stopami.
Automaty (jihanki) :: C.C. Lemon | Musujący napój cytrynowy od Suntory, reklamowany jako „70 cytryn w jednej butelce" (chodzi o witaminę C, nie sok). Jasnożółty, słodki, bardzo gazowany — jak lemonada na sterydach. W Japonii od 1994, stał się klasykiem automatów. Żółta puszka/butelka z rysunkową cytryną — nie da się pomylić. Alternatywa na upał gdy Pocari jest za „sportowy" a herbata za gorzka. Syn prawdopodobnie będzie go pił codziennie.
Konbini :: Onigiri | Trójkątny klocek ryżu z nadzieniem, owinięty nori (wodorosty). Genialna inżynieria opakowania: plastikowy rozdzielacz trzyma nori osobno od ryżu, żeby nie zmiękło — ciągniesz pasek i nori owija się wokół ryżu dopiero przy jedzeniu. Najpopularniejsze smaki: tuna-mayo (klasyk), ume (kwaśna śliwka — różowy), shake (łosoś — pomarańczowy), mentaiko (pikantna ikra dorsza). Kosztuje ~120–180 ¥ i jest posiłkiem samym w sobie. Japończycy jedzą ~5,8 miliarda onigiri rocznie. Śniadanie nr 1 w podróży.
Konbini :: Tamago sando | Kanapka z jajkiem — pozornie nic specjalnego, ale japońska wersja to objawienie. 7-Eleven robi najlepszą: puszyste, kremowe jajko (mix sałatki jajecznej i omletowej warstwy) między dwoma plasterkami miękkiego białego chleba bez skórki (shokupan). Sekret: japoński majonez Kewpie (tylko żółtka, ryżowy ocet) i idealnie ugotowane jajka. Kosztuję ~200 ¥ i jest jednym z powodów, dla których japońskie konbini są legendarne. Lawson ma wersję z grubym omleciku — też rewelacja.
Konbini :: Katsu sando | Kanapka z panierowanym kotletem wieprzowym (tonkatsu), sosem i czasem musztardą, w miękkim shokupan. Bardziej sycąca niż tamago sando — to jest lunch. Konbini-wersja jest dobra, ale najlepsza jest z butikowej kanapkarni (np. Maisen w Tokio). Panko (japońska bułka tarta) daje inną chrupkość niż europejska panierka — płatki są większe i bardziej powietrzne. Katsu sando stało się globalnym trendem gastronomicznym ok. 2018, ale w Japonii jedzą je od dekad.
Konbini :: Karaage-kun / FamiChiki | Smażony kurczak kupowany przy kasie — gorący, chrupiący, gotowy w sekundę. Karaage-kun (Lawson, od 1986) to małe bryłki w kilku smakach (regular, cheese, lemon). FamiChiki (FamilyMart) to większy kawałek, bardziej soczysty. Obie sieci traktują smażonego kurczaka poważniej niż niejedna restauracja. Jedzone w biegu na ulicy — idealne gdy głód atakuje między posiłkami. Za ~200 ¥ dostajesz coś, co w KFC kosztowałoby trzy razy tyle i byłoby gorsze.
Konbini :: Lody i mochi-ice | Japońska zamrażarka konbini to osobna atrakcja. Häagen-Dazs ma tu ekskluzywne smaki (matcha, hojicha, sakura, sweet potato) niedostępne nigdzie indziej na świecie. Yukimi Daifuku to lód waniliowy owinięty w cienko rozwałkowane mochi (kleisty ryż) — miękkie, ciągnące się, genialne. Jest też „ice no mi" (mrożone kuleczki soku), popsicle azuki i lody z konbini-ekspresu. W sierpniowym upale będziecie jedli lody 2× dziennie — i nikt was nie osądzi.
Konbini :: Zimne makarony latem | W letnim upale Japończycy przerzucają się na zimne makarony — konbini ma je gotowe. Hiyashi chūka: zimne ramen z warzywami, omletem i sosem sezamowym lub octowym — kolorowe i orzeźwiające. Zaru soba: gryczane noodle na bambusowej macie z zimnym tsuyu do maczania. Reimen (zimny ramen koreański): pikantny, z gumowymi noodle. Wszystkie za ~400–500 ¥, syciące i chłodzące. Sierpień w Japonii bez zimnych noodle to jak lato bez lodów.
Konbini :: Desery premium | Japońskie konbini mają osobną lodówkę z deserami, które wyglądają jak z cukierni. Warabimochi (przezroczyste galaretowate klocki z paprociowego skrobi, posypane kinako — prażoną mąką sojową): jigglujące, lekko słodkie, letni klasyk. Purin (japoński pudding — gęstszy i bardziej karmelowy niż europejski crème caramel). Sufle-naleśniki (puszysty naleśnik z bitą śmietaną). Lawson robi najlepsze desery (seria „Uchi Café"), 7-Eleven ma najlepszy purin. ~200–400 ¥ za deser lepszy niż w połowie europejskich restauracji.
Konbini :: Kawa z ekspresu | Świeżo mielona, parzona na miejscu za ~120 ¥ (mała) — lepsza niż myślisz i lepsza niż wiele kawiarni. 7-Eleven (Seven Café, od 2013) zrewolucjonizowało rynek: automat z prawdziwymi ziarnami arabiki przy kasie. Wkładacie kubek, wciskacie guzik, kawa mieli się i parzy na waszych oczach. Hot i iced. Lawson ma „MACHI café" (barista robi), FamilyMart ma „Famima Café." Łącznie japońskie konbini sprzedają ponad miliard kaw rocznie — to najbardziej niedoceniany system kawowy na świecie.
Sieci — miski ryżu (gyūdon/curry) :: Yoshinoya · 吉野家 | Gyūdon (miska ryżu z duszoną wołowiną i cebulą w słodko-słonym sosie) — król taniego jedzenia od 1899, gdy pierwszy bar otwarto przy targu rybnym w Tokio. Pomarańczowy szyld widać wszędzie. Zamawiacie rozmiar (nami / ō-mori), dokładacie surowe jajko (tamago) do rozbicia na gorącym ryżu, marynowany imbir beni-shōga gratis na ladzie. Miska ~500 ¥, na stół w minutę. Często otwarte 24h — ratunek po nocnym powrocie (np. z Daikoku). Motto: „hayai, yasui, umai" — szybko, tanio, smacznie. | 吉野家
Sieci — miski ryżu (gyūdon/curry) :: Sukiya · すき家 | Największa sieć gyūdon w Japonii (więcej lokali niż Yoshinoya). Menu szersze niż u konkurencji: gyūdon z serem, kimchi, startym yamaimo, curry, śniadaniowe zestawy z rybą i miso. Rodzinnie przyjazna — są normalne stoliki, nie tylko lada, więc łatwo wejść z Michałem. Miska od ~450 ¥, zamówienie przy stoliku lub w automacie. Dobra opcja gdy jedno chce wołowinę, drugie curry, a trzecie coś lekkiego — wszystko w jednym miejscu. | すき家
Sieci — miski ryżu (gyūdon/curry) :: Matsuya · 松屋 | Trzeci wielki gracz gyūdon, rozpoznawalny po żółto-niebieskim szyldzie. Zamawiacie w automacie biletowym przy wejściu (dobry trening przed resztą podróży!), a do każdego dania dostajecie darmową miskę zupy miso. Specjalności poza gyūdon: „gyū-meshi", gęste pikantne curry i zestawy z grillowanym mięsem (yakiniku teishoku). Tanio (~450–800 ¥), szybko i mniej turystycznie niż Yoshinoya. | 松屋
Sieci — miski ryżu (gyūdon/curry) :: CoCo Ichibanya · CoCo壱番屋 | Największa sieć curry na świecie („CoCo Ichi", od 1978). Sami składacie danie: ilość ryżu (podawana w gramach!), poziom ostrości (0 do 10 — nowicjusz zaczyna od 2–3) i dodatki: katsu wieprzowy, panierowane krewetki, ser, jajko, warzywa, natto. Japońskie curry jest łagodne, gęste i słodkawe — dla dzieci idealne na poziomie 0–1. Menu z obrazkami i po angielsku. ~800–1300 ¥ z dodatkami. Pewny strzał, gdy nikt nie wie, na co ma ochotę. | CoCo壱番屋
Sieci — sushi taśmowe (kaiten) :: Sushiro · スシロー | Numer 1 wśród kaiten-zushi (sushi na taśmie) w Japonii. Talerzyk od ~120 ¥ — jakość zawstydzająco dobra jak na tę cenę. Zamawiacie na tablecie (jest angielski), a wasze talerzyki jadą osobnym „ekspresowym" torem prosto do stolika, nad zwykłą taśmą. Kolory talerzy = różne ceny, liczycie je na koniec. W szczycie weźcie numerek w apce z wyprzedzeniem — kolejki bywają długie. Prawdopodobnie najlepszy stosunek jakości do ceny w całej podróży. | スシロー
Sieci — sushi taśmowe (kaiten) :: Kura Sushi · くら寿司 | Kaiten-zushi z atrakcją dla dzieci: zjedzone talerzyki wrzucacie do szczeliny w stole, a co 5 sztuk uruchamia „Bikkura Pon" — automat losuje na ekranie nad stołem kapsułę z gadżetem (anime, figurki). Michał pokocha. Sieć chwali się brakiem sztucznych dodatków i konserwantów, talerze jadą pod higienicznymi kopułkami. Ceny jak u Sushiro (~120 ¥/talerz), zamawianie na tablecie. Sushi + gra + nagroda = idealny obiad z dzieckiem. Bez rezerwacji, ale w weekend i w Obon pobierzcie numerek w apce Kura z wyprzedzeniem — kolejki bywają długie. | くら寿司
Sieci — sushi taśmowe (kaiten) :: Hama Sushi · はま寿司 | Najtańsza z wielkich sieci taśmowych (grupa Zensho, ta sama co Sukiya). Talerzyki od ~100 ¥, w dni powszednie bywają promocje jeszcze taniej. Na stole kilka rodzajów sosu sojowego (m.in. słodki z Kyūshū) i tablet do zamawiania. Mniej fajerwerków niż Kura, ale portfel odczuje różnicę. Dobre, gdy chcecie po prostu najeść się sushi bez zerkania na rachunek. Bez rezerwacji, ale w szczycie warto pobrać numerek w apce sieci, żeby nie stać pod drzwiami. | はま寿司
Sieci — ramen i udon :: Ippudo · 一風堂 | Sieć ramenu z Hakaty (Fukuoka), założona 1985 — jeden z pionierów, który wyniósł tonkotsu (kremowy wieprzowy bulion) na świat (dziś są w Nowym Jorku i Londynie). Klasyki: delikatny „Shiromaru" i pikantniejszy „Akamaru". Cienki, prosty makaron hakata — do resztki bulionu możecie dobrać samą dokładkę makaronu (kae-dama). Bardziej „restauracyjne" i wygodne niż ciasne kabiny Ichiran (patrz sekcja Tokio). ~1000–1400 ¥. | 一風堂
Sieci — ramen i udon :: Tenkaippin · 天下一品 | Kultowa sieć ramenu z Kioto (od 1971!) — miejscowy pewniak. Słynie z bulionu „kotteri": tak gęstego od kurczaka i warzyw, że przypomina bardziej sos niż zupę i oblepia makaron. Dla odważnych; kto woli klasykę, zamawia „assari" (lekki). Fani mówią wprost o „uzależnieniu od Tenka". Szukajcie żółtego szyldu 天下一品 — w Kioto traficie na nie łatwo, to lokalny rytuał zamiast turystycznej ramenowni. ~900 ¥. | 天下一品
Sieci — ramen i udon :: Marugame Seimen · 丸亀製麺 | Sieć udonu w stylu sanuki — makaron ugniatany i cięty na miejscu, gotowany na waszych oczach. Idziecie wzdłuż lady jak w stołówce: wybieracie miskę (kake, bukkake, kamatama), dokładacie z bufetu tempurę (chrupiące krewetki, warzywa, kurczak) i onigiri, płacicie na końcu. Makaron gruby, sprężysty, świeżutki. Absurdalnie tanio: podstawowa miska ~350–400 ¥, z tempurą wychodzicie za ~700 ¥. Szybkie, sycące, świetne dla dzieci. | 丸亀製麺
Sieci — ramen i udon :: 8-ban Ramen (Hachiban) · 8番らーめん | Regionalna duma Hokuriku — sieć z prefektury Ishikawa (spotkacie ją w okolicach Kanazawy), od 1967. Znak firmowy: „yasai ramen" — ramen z górą podsmażonych warzyw na lekkim bulionie, sycący, a mniej ciężki niż tonkotsu. Logo „8番" i hasło „nande yaro? Hachiban". Poza Hokuriku prawie nie istnieje, więc to lokalny smaczek do zaliczenia przy okazji Kanazawy/Alp. ~800–1000 ¥. | 8番らーめん
Sieci — teishoku i katsu :: Ōtoya · 大戸屋 | Sieć teishoku (zestaw: danie główne + ryż + zupa miso + pikle) w stylu domowej kuchni japońskiej, gotowane na zamówienie, nie z podgrzewacza. Zdrowo i „jak u mamy": grillowana ryba (hokke), kurczak nanban, smażone tofu, dużo warzyw. Menu z obrazkami. Idealne, gdy macie dość street foodu i chcecie porządny, zbilansowany posiłek. ~900–1300 ¥. Często na piętrze — szukajcie szyldu 大戸屋 i schodów w górę. | 大戸屋
Sieci — teishoku i katsu :: Yayoiken · やよい軒 | Teishoku z haczykiem, który pokochacie: ryż do woli (okawari) z automatu przy sali — dokładacie ile chcecie, gratis. Zamówienie w automacie biletowym. Klasyki: grillowana ryba, shōga-yaki (wieprzowina w imbirze), zestawy z kotletem. Tanio (~700–950 ¥) i sycąco. Wymarzone dla wygłodniałego nastolatka, który dosypie sobie trzy miski ryżu. | やよい軒
Sieci — teishoku i katsu :: Katsuya · かつや | Specjaliści od tonkatsu (panierowany kotlet wieprzowy) w wersji budżetowej. Katsu-don (kotlet z jajkiem na ryżu) albo zestaw z kapustą i ryżem za ~600–850 ¥ — ułamek ceny „porządnej" tonkatsu-ya, a najedzenie gwarantowane. Chrupiące panko, gęsty sos tonkatsu do polania. Dobre na szybki, treściwy lunch bez rezerwacji i ceremonii. | かつや
Sieci — teishoku i katsu :: Tenya · てんや | Tendon (tempura na misce ryżu polana słodkim sosem) w cenie street foodu. Sieć zdemokratyzowała tempurę, która potrafi być droga — podstawowy tendon z krewetką i warzywami ~600 ¥. Świeżo smażone, sos tentsuyu wsiąka w ryż. Szybko i pysznie; dobra bramka do świata tempury, zanim (albo zamiast) wydacie krocie w specjalistycznej tempura-ya. | 天丼てんや
Sieci — restauracje rodzinne (famiresu) :: Gusto · ガスト | Najtańszy i najczęściej spotykany famiresu w Japonii (grupa Skylark). Zamawiacie na tablecie (jest angielski), a jedzenie często przywozi... kot-robot „Bella-chan" — sunie między stolikami z tacą, dzieci szaleją (Michał!). Drink bar za ~250 ¥ = nielimitowane napoje, soki, kawa z automatu. Menu-worek: hamburg (stek mielony), makarony, ryże, frytki, zestawy dziecięce, parfait. Otwarte do późna, tanio (~700–1200 ¥). Idealne, gdy trzeba szybko, tanio i bez stresu nakarmić głodną rodzinę. | ガスト
Sieci — restauracje rodzinne (famiresu) :: Royal Host · ロイヤルホスト | Famiresu z wyższej półki (od 1971) — bez automatów i taniochy, za to obsługa kelnerska i realnie dobra kuchnia. Sztandarowe: curry duszone godzinami (kultowe wśród Japończyków), stek hamburgowy, zupa cebulowa gratin, sezonowe „fair" (co kilka tygodni inne menu — latem np. mango, brzoskwinie). Drożej niż Gusto (~1500–2500 ¥/os.), ale to cicha, komfortowa sala z klimatyzacją i pełne menu z obrazkami. Dobre na spokojniejszą, „porządną" kolację całą trójką. | ロイヤルホスト
Sieci — restauracje rodzinne (famiresu) :: Saizeriya · サイゼリヤ | Włoski famiresu o cenach nie z tej epoki — Milano doria (zapiekanka ryżowa) ~300 ¥, do tego makarony, pizza, sałatki, wszystko tanio. Ratunek dla zmęczonej rodziny: ogromne menu z obrazkami, drink bar (nielimitowane napoje), wygodne stoliki, klimatyzacja, dzieci mile widziane. Nie haute cuisine, ale najedzenie całej trójki za grosze i chwila oddechu od japońszczyzny. Idealne na „nie mamy siły dziś szukać". | サイゼリヤ
Sieci — restauracje rodzinne (famiresu) :: Denny's · デニーズ | Japońska wersja Denny's (należy do Seven & i — nie mylcie z amerykańskim oryginałem, menu jest zupełnie inne). Klimat amerykańskiego diner-a w japońskim wykonaniu: hamburg, omlety, naleśniki, gigantyczne parfait i desery, śniadania serwowane cały dzień. Drink bar, menu z obrazkami, otwarte długo. Trochę droższe od Gusto, przyjemniejsze wnętrze. Dobre na słodkie parfait po zwiedzaniu albo leniwe „amerykańskie" śniadanie. | デニーズ
Sieci — restauracje rodzinne (famiresu) :: Bamiyan · バーミヤン | Chiński famiresu grupy Skylark — chińszczyzna w wersji tanio-i-obficie. Gyoza (pierożki), ramen, mapo tofu, smażony ryż, karaage — porcje do dzielenia w stylu rodzinnym, na wspólny stół. Ceny jak w Gusto (dania od ~400–700 ¥), drink bar, tablet do zamawiania. Świetne, gdy macie dość japońskiej klasyki i chcecie coś bardziej wyrazistego i ostrego. | バーミヤン
Sieci — kawiarnie i wieczór :: Komeda Coffee · コメダ珈琲店 | Kawiarnia w stylu „kissaten" z Nagoi (od 1968) — oaza w środku zwiedzania. Sztandarowy patent: „morning service" — do kawy zamówionej rano dostajecie GRATIS tost z masłem i jajko. Legendarny deser „Shironoir": ciepła duńska bułka z zimnym lodem softem na wierzchu. Drewniane boksy, można długo posiedzieć w klimatyzacji podczas upału. Porcje hojne. Kawa ~500 ¥. Idealna przerwa dla nóg w połowie dnia. | コメダ珈琲店
Sieci — kawiarnie i wieczór :: Mister Donut · ミスタードーナツ | „Misudo" — dominująca i kultowa sieć pączków w Japonii. Gwiazda menu: „Pon de Ring" — pączek z połączonych kuleczek o ciągnącej, mochi-podobnej konsystencji (zupełnie inny niż europejski). Tanio, mnóstwo smaków, sezonowe edycje. Można usiąść i napić się kawy z dolewką. Słodki przystanek, który dzieci uwielbiają. Pączek ~150 ¥. | ミスタードーナツ
Sieci — kawiarnie i wieczór :: Torikizoku · 鳥貴族 | Sieć izakaya (japoński pub z jedzeniem) z Osaki, gdzie niemal wszystko — szpadki yakitori, przekąski, część drinków — kosztuje jedną, równą cenę (ok. 370 ¥). Wieczorny klimat: zamawiacie dużo małych rzeczy do dzielenia, piwo lub napój, i płacicie mało. Świetne na luźną kolację w grupie, zamówienia z tabletu. Dla nastolatka opcje bezalkoholowe, dla dorosłych nama biru (lane piwo). Jedyna z tych sieci, gdzie w piątek/sobotę wieczorem lub w Obon warto zarezerwować stolik (telefon/apka) — wieczorami bywa pełno. | 鳥貴族

Kosmetyki i pielęgnacja :: Włosy — szukaj Gamma-Docosalactone | Japoński patent (γ-ドコサラクトン) — molekuła, która wiąże się z włosem i wygładza go w cieple suszarki/prostownicy. Jest w &honey i wielu japońskich produktach „smooth/repair"; w Europie rzadkość. Dobry trop przy zakupie nowych odżywek. | Drogerie
Kosmetyki i pielęgnacja :: Melano CC — serum z witaminą C (Rohto) | Kultowe serum na przebarwienia i ślady po trądziku — czysta witamina C za ~1000 ¥. W Europie odpowiedniki kosztują kilka razy więcej, a ta wersja bywa tylko z importu. | Drogerie
Kosmetyki i pielęgnacja :: DHC Deep Cleansing Oil | Legendarny olejek do demakijażu z oliwą — rozpuszcza nawet wodoodporny filtr UV. Bestseller w Japonii za grosze, w PL trudniej dostępny i drożej. | Drogerie, DHC
Kosmetyki i pielęgnacja :: Curél (Kao) | Ceramidowa pielęgnacja dla skóry wrażliwej i atopowej — kremy, emulsje, filtry. Marka Kao tania w Japonii, w Europie premium i wąski wybór. | Drogerie
Kosmetyki i pielęgnacja :: HABA Squalane (olejek skwalanowy) | Czysty, jednoskładnikowy olejek skwalanowy „G-oil" — kultowy japoński nawilżacz. Marka praktycznie niedostępna poza Japonią. | HABA, domy towarowe
Kosmetyki i pielęgnacja :: Naturie Hatomugi (tonik z łzy Hioba) | Wielki, tani tonik nawilżający (500 ml za ~700 ¥) do twarzy i ciała — japoński klasyk do „warstwowania" (layering). | Drogerie
Kosmetyki i pielęgnacja :: Tani makijaż — Cezanne / Canmake / KATE | Japońska drogeryjna kosmetyka kolorowa: bazy, róże, tusze, cienie w jakości premium za ułamek ceny. Marki w PL prawie nieobecne. | Drogerie
Kosmetyki i pielęgnacja :: Krople do oczu — Rohto | Mocno mentolowe, orzeźwiające krople — kultowy gadżet, ratunek po długim dniu zwiedzania. | Drogerie

### PLAN
# Część 1: Kioto / Osaka / Nara

== Dzień 0 | czw 30.07 | Wylot z Polski | Lot do Japonii
Dzień podróży: Kraków → Abu Dhabi → Osaka. Lot nocny — lądujecie jutro 11:40 (Dzień 1). Spróbujcie przespać drugi odcinek (jet lag +7h). 🧳 Bagaż podręczny: powerbank, ładowarki, leki, szczoteczki, zmiana na samolot. 📱 PRZED WYLOTEM: Visit Japan Web wypełnione dla całej trójki + QR-y zapisane OFFLINE (screenshoty — Wi-Fi na KIX bywa zapchane) + screenshot rezerwacji KABIN Minamiza z adresem (formularz imigracyjny pyta o adres pobytu). ⚠️ Płyny/kosmetyki: lecicie bagażem podręcznym only — sprawdźcie limity (100 ml/butelka, 1 l łącznie) przy pakowaniu, nie na lotnisku.
- 8:00 | 🧳 Wyjazd na Balice (KRK) | Na lotnisku ~2,5–3h przed odlotem. Paszporty (ważne >6 mies.), potwierdzenia rezerwacji.
- 11:20 | 🛫 Kraków → Abu Dhabi | Etihad EY 164, A321LR, 5h40, lądowanie 19:00 (Terminal A). TV, Wi-Fi, USB. (AUH +2h vs Polska.)
- 19:00 | 🔄 Przesiadka Abu Dhabi (~2h10) | Terminal A. Rozprostować nogi, woda, lekki posiłek przed nocnym odcinkiem.
- 21:10 | 🛫 Abu Dhabi → Osaka (KIX) | Lot nocny ~9,5h, lądowanie jutro 11:40 (T1). ŚPIJCIE ile się da — rano zaczyna się Japonia!

== Dzień 1 | pt 31.07 | Przylot + Gion | KABIN Minamiza, Kioto
Przylot na KIX 11:40, ICOCA, Haruka do Kioto, wieczorny Gion. Godziny poniżej REALISTYCZNE (nie optymistyczne) — paszportówka w szczycie lata to 45–90 min nawet z QR; jak pójdzie szybciej, macie bonus, nie poślizg. Jet lag (+7h) = wieczorem energia, jutro pośpicie do ~10:00 i tak ma być.
- 11:40 | ✈️ Lądowanie KIX (T1) | Bagaż podręczny only = zero czekania na taśmę. QR-y Visit Japan Web z telefonu (offline!) — mocno przyspieszają. Cierpliwie: hala odpraw w szczycie lata żyje własnym rytmem.
- 12:50 | 💴 Gotówka na start — ATM 7-Bank | W hali przylotów / przy przejściu na stację: wypłata ~60–80 000 ¥ na trójkę (polskie karty Visa/Mastercard działają w bankomatach 7-Bank i JP Post, menu EN). Za chwilę ICOCA ×3 = 6 000 ¥ gotówką w automacie, a dalej czeka gotówkowa Japonia: Kamikōchi ~9 000 ¥, parkingi, targi, stragany matsuri. Raz teraz zamiast szukania bankomatu w Alpach.
- 13:00 | 💳 ICOCA ×3 — stacja JR Kansai Airport | Mostek z T1 (poziom 2F) prosto na stację. Automaty z logo ICOCA (szybciej niż okienko): 2 000 ¥/karta (500 ¥ kaucja + 1 500 ¥ salda). Działają w całej Japonii: pociągi, metro, busy, konbini, automaty, lockery. Doładowanie w każdym konbini. Trzy karty = trzy pamiątki na koniec. | Kansai Airport Station
- 13:30 | 🚃 Haruka Express → Kyoto (~75 min) | Bilet turystyczny 2 200 ¥/os. — kupcie online przed wylotem (WEST QR E-Ticket, skan na bramce, zero kolejek). Pociągi co 30 min: wsiadacie w najbliższy, godziny są elastyczne. Półki na bagaż na końcach wagonów. Pierwsza Japonia za oknem! | Kyoto Station
- 15:00 | 🚕 Kyoto Station → hotel (~10 min, ~1 000 ¥) | Postój taxi: wyjście Central (północne), NIE Hachijo — Hachijo zmusza taksówkarza do objazdu całego dworca, a w piątkowe popołudniowe korki to strata czasu i pieniędzy. Z trzema walizkami najwygodniej.
- 15:20 | 🏨 Check-in KABIN Minamiza | Rzeczy do pokoju, prysznic, świeże ubrania — reset po 24h podróży.
- 16:30 | 🏮 Spacer po Gion — kanał Shirakawa | Shirakawa (wierzby, kamienny mostek, kanał) — dużo klimatyczniej i ciszej niż Hanamikoji, która jest głównie betonową drogą z ruchem samochodowym i turystami polującymi na gejsze. Jak starczy czasu, 5 min stamtąd na Hanamikoji-dori — szansa na maiko śpieszące do herbaciarni pod wieczór, ale bez blokowania drogi. | Shirakawa Canal, Gion, Kyoto
- 18:00 | ⛩️ Yasaka Shrine | 5 min od hotelu, o zmierzchu podświetlone latarnie — pierwsza japońska świątynia wieczorem to dobry początek. Wstęp wolny. | Yasaka Shrine, Kyoto
- 18:30 | 🍽️ Kolacja — Gion, boczne uliczki (NIE Pontocho) | Piątek wieczór w szczycie lata = Pontocho oblegane (kolejki 30–60 min) — to nie jest wieczór na sterczenie po 24h na nogach. Większa izakaya albo coś prostego w bocznych uliczkach; po podróży apetyt bywa dziwny i to normalne. Pontocho z rezerwacją macie w planie na inne wieczory.
- 20:00 | 🌙 Rzeka Kamo | Podświetlone mosty, lokalni na nabrzeżu, ciepły wieczór. Jet lag = energia, wykorzystajcie na powolny spacer.
- 22:00 | 🏨 Hotel | Nie będziecie senni — połóżcie się mimo to. Jutro ŻADNEGO budzika: śpicie do oporu, plan dnia 2 zaczyna się o 10:00 (a jak zbudzicie się o 6:00 — plan B: Kiyomizu na otwarcie, patrz Dzień 2).

== Dzień 2 | sob 01.08 | Higashiyama (północ→południe) + Fushimi Inari nocą | KABIN Minamiza, Kioto
Jet lag (+7h): prawdopodobnie śpicie do późna i macie energię w nocy. Trasa jedną linią: Ginkaku-ji → Ścieżka Filozofa → Nanzen-ji → Kiyomizu → Sannenzaka w dół → Gion. Najgorętsze godziny (13–14:30) pod dachem. 🥵 Protokół upału: woda co godzinę, przerwa AC co ~1,5h, elektrolity. 🔀 WENTYL: jeśli po Kiyomizu baterie są na zerze — Fushimi nocą przenieście 1:1 na wieczór Dnia 4 (jedyny luźny wieczór w Kioto) zamiast zaliczać na siłę w drugiej dobie po podróży. ⚠️ PLAN B (jeśli jet lag obudzi was o 5–6 rano): odwróćcie dzień! Kiyomizu-dera na otwarcie 6:00 (pusto, chłodno, najlepsze zwiedzanie tej świątyni w ogóle) → Sannenzaka ~7:30 (uliczki puste, sklepy zamknięte ale klimat 10/10) → śniadanie → powrót do hotelu na sjestę w środku dnia (11:00–15:00 AC!) → po 15:00 Ginkaku-ji + Ścieżka Filozofa + Nanzen-ji → kolacja → Fushimi nocą bez zmian.
- 10:00 | 🍳 Późne wstawanie + śniadanie | Nie walczcie z jet lagiem. Konbini (onigiri, kawa) lub kawiarnia przy Gion-Shijo.
- 10:30 | 🚕 Taxi → Ginkaku-ji | ~15–20 min z Gion (~1 500 ¥), rano bez korków. Alternatywa: bus 203, ale taxi w 3 osoby wygrywa.
- 11:00 | 🛕 Ginkaku-ji (Srebrny Pawilon) | Kannon-den, stożek Kōgetsudai, ogród mchu. Rano kameralnie, miękkie światło. ~45 min. 🕐 8:30–17:00, ~500 ¥. | Ginkaku-ji, Kyoto
- 12:00 | 🚶 Ścieżka Filozofa (Tetsugaku-no-michi) | ~2 km wzdłuż kanału na południe. Cień częściowy — spokojne tempo, przystanek na matchę/lody. Honen-in po drodze (wolny wstęp) = najcienistszy, najchłodniejszy punkt trasy, gęsty las. ⚠️ Jeśli słońce w pełni praży: przejdźcie tylko początek (Ginkaku-ji + Honen-in, najładniejszy i najbardziej zacieniony fragment), potem złapcie klimatyzowaną taksówkę prosto pod Nanzen-ji — reszta ścieżki ma mało głębokiego cienia. | Philosophers Path, Kyoto
- 13:00 | 🍜 Długi lunch + kawiarnia AC | Okolice Nanzen-ji / Okazaki. Yudofu, soba lub udon. Celowo 1,5h — najgorętsza część dnia pod dachem. Bez pośpiechu!

- 16:00 | 🛕 Kiyomizu-dera | Tłumy po 16:00 rzedną, taras patrzy na zachód = złote światło na panoramę Kioto. ~1h. 🕐 do 18:30 (sierpień). | Kiyomizu-dera, Kyoto
- 17:15 | 🏮 Sannenzaka + Ninenzaka W DÓŁ | Uliczki bez tłumów, wieczorne światło. Uwaga: część sklepików zamyka się 17–18 — jeśli zakupy (ceramika), zróbcie je wcześniej przy Ścieżce Filozofa lub innego dnia. | Ninenzaka Sannenzaka, Kyoto

D20 | 13:45 | 🎭 | Lotnisko zbudowane wbrew wszystkim | Narita to najbardziej oprotestowane lotnisko świata: w latach 60. rząd wskazał pod budowę ziemie rolników z Sanrizuka praktycznie bez pytania — odpowiedziały mu dekady oporu chłopów i studentów: barykady, wieże postawione na osi pasa, regularne bitwy z policją. Otwarcie w 1978 opóźnił o dwa miesiące szturm radykałów, którzy zdemolowali wieżę kontroli lotów. Ślady zostały do dziś: druga droga startowa jest krótsza, niż planowano, a drogi kołowania omijają enklawy gospodarstw, których właściciele nigdy nie sprzedali ziemi. Startujecie z jednego z najciekawszych pomników powojennej Japonii.
D20 | 18:00 | ✈️ | A380 — latający dom | Wracacie największym samolotem pasażerskim w historii: dwa pełne pokłady, rozpiętość skrzydeł ~80 m (za duża na standardowe stanowiska — lotniska budowały dla niego osobne rękawy), certyfikacja aż do 853 pasażerów, u Etihada ~486 w komforcie. Na górnym pokładzie, na samym przodzie, kryje się „The Residence" — jedyny w lotnictwie pasażerskim trzypokojowy apartament: salon, sypialnia z podwójnym łóżkiem, własny prysznic i osobisty kamerdyner (bilet: okolice 20 tys. dolarów). Produkcję A380 zakończono w 2021 — ekonomia wygrała z rozmachem — więc każdy lot tym kolosem to już kawałek historii lotnictwa. Godne domknięcie podróży.
D1 | 16:30 | ⚡ | Pokémon GO: co złapać tylko w Japonii | Dla grających w Pokémon GO Japonia to łowisko: Farfetch'd (Kamonegi) jest Pokémonem regionalnym — dostępnym na dziko w całej Azji, a w Europie NIE do złapania, więc to okazja na cały wyjazd. Do tego w wielu miastach są „poke-studzienki" (Pokéfuta) — ozdobne włazy z Pokémonami, które prawie zawsze są też PokéStopami; kilka z nich macie po drodze (Kioto, Uji, Kanazawa, Takayama, Ueno) i wskazujemy je w kolejnych dniach. Weźcie powerbank — polowanie zjada baterię.
D1 | 18:00 | ⚡ | Poke-studzienka tuż za Yasaka | Na terenie samej świątyni jej nie ma, ale kilka kroków dalej — w parku Maruyama zaraz za Yasaka Shrine — leży poke-studzienka z Cyndaquil i Darmanitan (Pokémony ognia z generacji Johto, wzorowanej właśnie na Kansai). Z narożnika parku widać bramę świątyni. Zwykle też PokéStop w Pokémon GO — Michał zakręci przy wieczornym spacerze.
D3 | 19:45 | ⚡ | Największy Pokémon Center w Kansai — w tym samym budynku | Wasz przystanek w Shinsaibashi to ten sam adres co Pokémon Center OSAKA DX: Daimaru Shinsaibashi, budynek główny, 9. piętro (winda w górę, zero objazdu). Przy wejściu witają naturalnej wielkości figury legendarnej trójki ptaków — Articuno, Zapdos i Moltres — a przy kawiarni dwa Pikachu przebrane za kucharzy. To flagowy, przestronny sklep z merchem, którego nie kupicie poza Kansai: Pikachu-komik manzai i Pikachu jedzące takoyaki. Obok Pokémon Café (drewniane, stylowe wnętrze) — ale tylko z rezerwacją online (cafe.pokemon.co.jp) robioną z miesięcznym wyprzedzeniem; sam sklep wchodzicie bez rezerwacji. Czynne 10:00–20:00.
D4 | 13:10 | ⚡ | Ho-Oh przy moście Togetsukyo | Na wysepce Nakanoshima, przy południowym końcu mostu Togetsukyo (obok stacji Hankyu), jest poke-studzienka z legendarnym Ho-Oh szybującym nad morzem kwiatów wiśni — z pagodą i górą Arashiyama w tle. Mijacie ją, przechodząc przez most. Zwykle też PokéStop w Pokémon GO.
D4 | 17:15 | ⚡ | Pokémon Center Kyoto — jeśli macie moment przy Shijo | Wracacie w rejon Shijo/Kawaramachi, a ~10 min pieszo na zachód, przy Shijo-Karasuma, jest Pokémon Center Kyoto (obecnie w budynku SUINA Muromachi, 2. piętro — przeniósł się z Takashimayi). Wita figura Ho-Oh w towarzystwie „Maiko Pikachu" w kimonie kiotyjskiej gejszy, a wzory są ekskluzywne dla Kioto: motywy yukaty i drzeworytów. Czynne do 20:00, więc zdążycie przed kolacją. To nie jest po drodze do żadnego punktu programu — wpadacie tylko, jeśli jest luz.
D5 | 15:30 | ⚡ | Poke-studzienki z „herbacianym" Pokémonem | Uji ma dwie poke-studzienki (Pokéfuta) tuż przy Waszej trasie. Ta z Sinistcha i Poltchageist — Pokémonami dosłownie zrobionymi z matchy — stoi w parku herbacianym Chazuna, po drodze od stacji JR Uji do Byōdō-in; trafniejszego miejsca w stolicy matchy nie ma. Druga, ze Scorbunny i Spinda (obwódka w kolorze zielonej herbaty), jest przy moście Asagiri, parę kroków przez rzekę od Byōdō-in. Obie to zwykle PokéStopy w Pokémon GO.
D6 | 11:20 | ⚡ | Poke-studzienka Milotic przy Kenroku-en | Jedyna poke-studzienka w całej prefekturze Ishikawa leży tuż przy wejściu do National Crafts Museum, kilka kroków od ogrodu (zero objazdu). Widnieje na niej Milotic — „najpiękniejszy Pokémon", wybrany dlatego, że Kanazawa uchodzi za jedno z najpiękniejszych miast Japonii; w tle sylwetki muzealnych dzieł sztuki. Dla grających w Pokémon GO to zwykle też PokéStop — da się zakręcić na miejscu.
D7 | 11:00 | ⚡ | Poke-studzienka z trzema małpkami w starym mieście | W starej Takayamie, na ulicy Honmachi przed domem spotkań Daimasa (飛騨高山まちなか交流館 だいまさ, kilka kroków od Sanmachi), jest poke-studzienka z trójką „żywiołowych małpek" — Pansage, Pansear i Panpour — na tle panoramy miasteczka. Zainstalowana w 2024. Dla gracza GO zwykle też PokéStop; przy spacerze po starówce łatwo po nią zboczyć.
D13 | 16:30 | ⚡ | Sunshine City: Pokémon — sprawdźcie przed wyjazdem | Uwaga dla Michała: największy w Japonii Pokémon Center MEGA TOKYO (tu, w Sunshine City) jest od marca 2026 zamknięty po tragicznym incydencie i oficjalnie ma wrócić dopiero ok. września 2026 — czyli w sierpniu najpewniej NIECZYNNY (razem z Pokémon Card Station i Pokémon GO Lab.). Krąży informacja o mniejszym pop-upie „Pikachu Sweets" na tym samym piętrze (Alpa 2F), ale jego status na sierpień jest niepewny — zweryfikujcie tuż przed wylotem na sunshinecity.jp. Pewne, otwarte sklepy macie i tak po drodze: Osaka DX (Dzień 3), Skytree (Dzień 14) i Shibuya (Dzień 16).
D14 | 14:45 | ⚡ | Pokémon Center pod samą wieżą | Solamachi, w którym łapiecie chłód i deser, mieści Pokémon Center Skytree Town (East Yard, 4. piętro) — zero dojazdu, ten sam kompleks pod wieżą. To jasny, kolorowy, „rodzinny" sklep: przy wejściu figury legend Rayquazy, Lunali i Solgaleo, a Pikachu trzyma miniaturę Skytree, której podświetlenie zmienia się z porą roku — latem na czerwono, w klimacie festiwalu fajerwerków. Idealny przystanek między slotem na taras a wieczorem.
D18 | 15:15 | ⚡ | Pokémon Center obok Nintendo — w zupełnie innym stylu | W tym samym Shibuya Parco, gdzie bierzecie numerek do Nintendo Tokyo, na 6. piętrze jest Pokémon Center Shibuya — najbardziej nietypowy sklep tej sieci. Zamiast białych ścian i słodkich maskotek: czarne wnętrze, cyberowe LED-y, klimat nocnego klubu. Wita Was naturalnej wielkości Mewtwo, który kołysze się w szklanej tubie, jakby oddychał (obok niego Mew), a merch jest w „ulicznym", streetwearowym stylu Shibui. Jedno wejście, dwie atrakcje — grzech nie zajrzeć.
D17 | 13:30 | ⚡ | Poke-studzienki przy muzeum w Ueno | W drodze od stacji do Tokyo National Museum, w parku Ueno, są dwie poke-studzienki. Ta z Baltoy i Bronzor jest po stronie muzeum narodowego — i nieprzypadkowo: Baltoy przypomina gliniana figurkę dogū, a Bronzor starożytne brązowe lustro, czyli dokładnie takie zabytki jak w środku. Druga, z Tyrunt („Pokémon ze skamieliny") i Wynaut, stoi obok, przy Muzeum Przyrody i Nauki. Dla grających w Pokémon GO to zwykle też PokéStopy.

.res-left.dl-done{background:#e2f0eb;color:#115c4a}
.res-evt .res-dot{background:var(--card);box-shadow:0 0 0 2px var(--rtc,#bbb)}
.res-evt .res-card{background:#fbf7ee}
/* Pakowanie / Jedzenie — karty grup */
.ck-top{display:flex;align-items:center;gap:12px;margin:2px 0 18px}
.ck-bar{flex:1;height:8px;border-radius:6px;background:#e9e1d2;overflow:hidden}
.ck-bar-f{height:100%;background:var(--teal);border-radius:6px;transition:width .25s}
.ck-top-l{font-size:.8em;font-weight:700;color:var(--muted);white-space:nowrap}
.ck-card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.ck-gh{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #f1ebde}
.ck-ic{font-size:1.2em;line-height:1}
.ck-gt{flex:1;font-family:var(--font-serif);font-weight:700;font-size:.98em;color:var(--text)}
.ck-gc{font-size:.72em;font-weight:700;color:var(--muted);background:#f2ece0;border-radius:20px;padding:2px 10px}
.ck-items{padding:6px 8px 8px}
.ck-row{display:flex;align-items:flex-start;gap:10px;padding:7px 9px;border-radius:9px;cursor:pointer;transition:background .12s}
.ck-row:hover{background:#faf6ee}
.ck-cb{flex:0 0 auto;width:20px;height:20px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;margin-top:1px;transition:.15s}
.ck-on .ck-cb{background:var(--teal);border-color:var(--teal)}
.ck-tx{font-size:.9em;line-height:1.45;padding-top:1px}
.ck-tx b{font-weight:700}
.ck-on .ck-tx{text-decoration:line-through;opacity:.5}
.ck-d{color:var(--muted);font-weight:400}
.ck-grp{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.ck-grp:first-of-type{margin-top:4px}
.ck-mon{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--pc,var(--kin));display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:700;font-size:1.15em;color:var(--pc,var(--kin));flex:none;line-height:1}
.ck-mon.ck-mon-k2{font-size:.92em;letter-spacing:-.01em}
.ck-gt2{flex:1;font-family:var(--font-serif);font-weight:700;font-size:1.12em;color:var(--text)}
.ck-gc2{font-size:.74em;font-weight:700;color:var(--muted);background:#f2ece0;border-radius:20px;padding:3px 11px}
.p-gold{--pc:var(--kin)}
/* Mapa trasy (Plan) */
.route-map{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px 12px;margin-bottom:14px}
.rm-title{font-family:var(--font-serif);font-weight:700;font-size:1.05em;color:var(--text);margin-bottom:4px}
.rm-title span{font-family:var(--font-jp);font-size:.66em;color:var(--kin);letter-spacing:.22em;margin-left:7px}
.rm-legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;font-size:.74em;color:var(--muted);margin-top:6px}
.rm-legend span{display:inline-flex;align-items:center;gap:5px}
.rm-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* Budżet */
.stat-sub{font-size:.68em;color:var(--muted);margin-top:2px}
.bud-row{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px 15px;margin-bottom:10px}
.bud-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bud-cat{font-weight:700;font-size:.95em}
.bud-amt{font-size:.84em;color:var(--muted);white-space:nowrap}
.bud-amt b{color:var(--text)}
.bud-track{height:8px;border-radius:6px;background:#efe9dc;overflow:hidden;margin:8px 0 6px}
.bud-bar{height:100%;border-radius:6px}
.bud-note{font-size:.78em;color:var(--muted);line-height:1.45}
.bud-total{display:flex;justify-content:space-between;align-items:baseline;padding:11px 15px;border-top:2px solid var(--border);font-family:var(--font-serif);font-weight:700;margin-top:4px}
.bud-total b{color:var(--p1)}
.bud-conv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px 16px;margin-bottom:16px}
.bud-conv-l{font-weight:700;font-size:.9em}
.bud-conv input{width:120px;padding:7px 11px;border:1px solid var(--border);border-radius:8px;font-size:1em;font-family:var(--font);background:#fffdf8;color:var(--text);text-align:right}
.bud-conv input:focus{outline:none;border-color:var(--indigo)}
.bud-conv-eq{color:var(--muted)}
.bud-conv-out{font-family:var(--font-serif);font-weight:700;font-size:1.18em;color:var(--p1)}
/* Sub-tabs (Zakupy: Co kupić / Budżet) */
.subtabs{display:flex;gap:4px;background:#ece5d6;border-radius:11px;padding:4px;margin-bottom:20px}
.subtab{flex:1;text-align:center;padding:9px 8px;font-family:var(--font);font-weight:700;font-size:.86em;border:none;border-radius:8px;cursor:pointer;color:var(--muted);background:none;transition:.15s;user-select:none}
.subtab.on{background:var(--card);color:var(--p1);box-shadow:var(--shadow)}
.subtab:hover:not(.on){color:var(--text)}
.subpane{display:none}
.subpane.on{display:block}
.shop-wh{display:block;font-size:.92em;color:var(--p2);font-weight:600;margin-top:3px}
.shop-wh .mlink{color:var(--p2);border-bottom:1px dotted var(--p2)}
.shop-wh .mlink:hover{color:var(--red);border-bottom-color:var(--red)}
.ck-on .shop-wh{color:var(--muted)}
.ck-on .shop-wh .mlink{color:var(--muted);border-bottom-color:var(--muted)}
.shop-own{display:inline-block;font-size:.62em;font-weight:700;color:var(--kin);background:#f6efdd;border-radius:10px;padding:1px 7px;margin-left:7px;vertical-align:middle;text-transform:uppercase;letter-spacing:.05em}
.shop-del{flex:0 0 auto;align-self:center;width:24px;height:24px;border:none;border-radius:7px;background:none;color:#b9b0a3;font-size:19px;line-height:1;cursor:pointer;transition:.15s}
.shop-del:hover{background:#f3d9d3;color:var(--red)}
.shop-add{padding:4px 10px 10px}
.shop-add-btn{width:100%;padding:9px;border:1.5px dashed var(--border);border-radius:9px;background:none;color:var(--muted);font-family:var(--font);font-weight:700;font-size:.84em;cursor:pointer;transition:.15s}
.shop-add-btn:hover{border-color:var(--p2);color:var(--p2);background:#f6fbf9}
.shop-add-form{display:flex;flex-direction:column;gap:7px}
.shop-add-form[hidden]{display:none}
.shop-add-in{padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-family:var(--font);font-size:.9em;background:#fffdf8;color:var(--text)}
.shop-add-in:focus{outline:none;border-color:var(--p2)}
.shop-add-act{display:flex;gap:8px}
.shop-add-save{flex:1;padding:9px;border:none;border-radius:8px;background:var(--p2);color:#fff;font-family:var(--font);font-weight:700;font-size:.86em;cursor:pointer}
.shop-add-save:hover{filter:brightness(1.06)}
.shop-add-cancel{padding:9px 16px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--muted);font-family:var(--font);font-weight:600;font-size:.86em;cursor:pointer}
.shop-add-cancel:hover{color:var(--text)}
.shop-cam{margin-left:auto;flex:0 0 auto;align-self:center;width:30px;height:30px;border:none;border-radius:8px;background:none;font-size:15px;line-height:1;cursor:pointer;opacity:.38;transition:.15s;padding:0}
.ck-row:hover .shop-cam{opacity:.8}
.shop-cam:hover{opacity:1;background:#efe9dc}
.shop-thumb{margin-left:auto;flex:0 0 auto;align-self:center;width:40px;height:40px;border:1px solid var(--border);border-radius:8px;background-size:cover;background-position:center;background-repeat:no-repeat;cursor:pointer;padding:0}
.shop-thumb:hover{border-color:var(--p2)}
.lightbox{position:fixed;inset:0;background:rgba(30,22,14,.85);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.lb-inner{max-width:94vw;max-height:92vh;display:flex;flex-direction:column;gap:14px;align-items:center}
.lb-inner img{max-width:94vw;max-height:76vh;border-radius:12px;box-shadow:0 12px 44px rgba(0,0,0,.5);object-fit:contain;background:#fff}
.lb-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lb-btn{padding:10px 20px;border:none;border-radius:9px;font-family:var(--font);font-weight:700;font-size:.9em;cursor:pointer;background:#fffdf8;color:var(--text)}
.lb-btn:hover{filter:brightness(.96)}
.lb-btn.lb-del{background:var(--red);color:#fff}
.lb-cap{color:#e8e2d6;font-size:.82em;text-align:center;max-width:640px;line-height:1.5}
.lb-cap a{color:#f0d98a;text-decoration:underline}
.img-credits{margin:8px 0 4px;font-size:.76em;color:var(--muted)}
.img-credits summary{cursor:pointer;font-weight:600;padding:6px 2px;list-style:none}
.img-credits summary::-webkit-details-marker{display:none}
.img-credits-b{padding:6px 4px 4px;line-height:1.7;color:#9a9081}
.img-credits-b a{color:var(--indigo);text-decoration:none}
/* Stats tab */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:10px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat-label{font-size:.75em;color:var(--muted);margin-bottom:2px}
.stat-val{font-size:1.4em;font-weight:700}
.stat-val.red{color:var(--red)}
.stat-val.teal{color:var(--teal)}
.stat-val.indigo{color:var(--indigo)}
.stat-val.gold{color:var(--gold)}
.chart-wrap{position:relative;width:100%;height:300px;margin-bottom:24px}
.dist-tbl{width:100%;border-collapse:collapse;font-size:.8em}
.dist-tbl th{text-align:left;padding:8px 6px;font-weight:700;border-bottom:2px solid var(--border);color:var(--text)}
.dist-tbl th.r{text-align:right}
.dist-tbl td{padding:6px;border-bottom:.5px solid var(--border)}
.dist-tbl td.r{text-align:right}
.dist-tbl tr.warn td{font-weight:600}
.dist-tbl .km-hi{color:var(--red);font-weight:700}
.dist-tbl .km-mid{color:var(--gold);font-weight:600}
.dist-tbl .part-row td{background:var(--bg);font-weight:700;font-size:.85em;color:var(--muted);letter-spacing:.05em;padding:10px 6px}
.legend-row{display:flex;gap:16px;flex-wrap:wrap;font-size:.78em;color:var(--muted);margin:10px 0 0}
.legend-row span{display:flex;align-items:center;gap:4px}
.legend-dot{width:10px;height:10px;border-radius:2px}
/* Formatted reservation details (apps list) */
.rx-section{font-weight:700;color:var(--text);margin:10px 0 4px;font-size:.9em;letter-spacing:.02em}
.rx-section:first-child{margin-top:4px}
.rx-item{padding:3px 0 3px 8px;border-left:2px solid var(--border);margin:3px 0 3px 4px;line-height:1.45}
/* Day navigation (Plan tab) */
.day-nav{position:sticky;top:0;z-index:10;display:flex;gap:5px;overflow-x:auto;padding:10px 2px;margin:0 0 10px;background:var(--bg);-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.day-nav::-webkit-scrollbar{display:none;height:0;width:0}
.day-nav a{flex:0 0 auto;font-size:.72em;font-weight:700;text-decoration:none;padding:4px 9px;border-radius:8px;border:1px solid transparent;transition:.15s}
.day-nav a:hover{transform:translateY(-1px);filter:brightness(.97)}
.dn-top{flex:0 0 auto;position:sticky;left:0;z-index:2;font-size:.78em;font-weight:700;padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-family:var(--font);transition:.15s;box-shadow:2px 0 6px rgba(0,0,0,.06)}
.dn-top:hover{color:var(--text);filter:brightness(.97)}
.dn-1{background:#f7e7e3;color:#8f2e20;border-color:#ecd2cb}
.dn-2{background:#e2f0eb;color:#115c4a;border-color:#cce3da}
.dn-3{background:#e7edf4;color:#2c456b;border-color:#d3dfea}
.dc{scroll-margin-top:54px}
/* Per-day kebab menu (kopiuj / podmień) */
.dmenu-btn{position:relative;flex:none;background:none;border:none;font-size:1.3em;line-height:1;color:var(--muted);cursor:pointer;padding:4px 10px;border-radius:8px;font-family:var(--font)}
.dmenu-btn:hover{background:#f1ebe0;color:var(--text)}
.dmenu-btn.dmenu-mod{color:var(--teal)}
.dmenu-btn.dmenu-mod::after{content:'';position:absolute;top:2px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--teal);border:1.5px solid var(--card)}
.dmenu-pop{display:none;position:fixed;z-index:50;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;min-width:150px}
.dmenu-pop button{display:block;width:100%;text-align:left;background:none;border:none;padding:11px 15px;font-size:.86em;font-family:var(--font);color:var(--text);cursor:pointer;white-space:nowrap}
.dmenu-pop button:hover{background:#f5f0e6}
.day-edit-ta{width:min(640px,90vw);min-height:280px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82em;line-height:1.5;padding:12px;border:1px solid var(--border);border-radius:10px;box-sizing:border-box;resize:vertical;background:#fffdf8;color:var(--text)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#2a2723;color:#fff;padding:10px 18px;border-radius:8px;font-size:.85em;opacity:0;pointer-events:none;transition:.2s;z-index:200}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* Opening-hours inline badge */
.hrs{color:var(--teal);font-weight:600}
/* Important info tab */
.info-grp{font-family:var(--font-jp);font-weight:700;font-size:.8em;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:24px 0 10px}
.info-grp:first-child{margin-top:0}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:9px}
.info-card .il{font-weight:700;font-size:.95em;margin-bottom:3px}
.info-card .ix{font-size:.84em;color:var(--muted);line-height:1.55}
.info-card .ix a{color:var(--indigo)}
.ph-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 15px;box-shadow:var(--shadow);margin-bottom:9px}
.ph-pl{font-size:.8em;color:var(--muted);margin-bottom:3px}
.ph-jp{font-family:var(--font-jp);font-size:1.22em;font-weight:500;color:var(--text);line-height:1.45}
.ph-rom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:.85em;color:var(--p3);font-style:italic}
.ph-pron{display:inline-block;font-size:.76em;color:#8a6d1f;background:#fdf6e7;border-radius:20px;padding:2px 11px;letter-spacing:.02em;font-style:normal}
.info-warn{background:#fff7ed;border:1px solid #f3d9b8;border-radius:10px;padding:11px 14px;font-size:.82em;color:#8a5a18;margin-bottom:18px;line-height:1.5}
.ival{font-weight:700;color:var(--text)}
.ibtn{font-family:var(--font);background:none;border:1px dashed var(--border);color:var(--muted);cursor:pointer;font-size:.9em;padding:1px 7px;border-radius:6px;transition:.15s;white-space:nowrap}
.ibtn:hover{border-color:var(--teal);color:var(--teal);background:#f0faf8}
.ibtn-add{font-weight:600}
/* Nowe zakładki: checklisty, rozmówki, terminy */
.hdr-info-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:6px}
.cd-head{font-size:.9em;color:var(--teal);font-weight:700}
.tz-clock{font-size:.8em;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:3px 11px;letter-spacing:.02em}
.tz-clock:empty{display:none}
.chk-row{display:flex;align-items:flex-start;gap:10px;background:var(--card);border-radius:9px;padding:10px 13px;box-shadow:var(--shadow);margin-bottom:7px;cursor:pointer;transition:transform .12s}
.chk-row:hover{transform:translateX(2px)}
.chk-box2{flex:0 0 auto;width:20px;height:20px;border:2px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;margin-top:1px}
.chk-on .chk-box2{background:var(--teal);border-color:var(--teal)}
.chk-on{opacity:.6}
.chk-on .chk-txt strong{text-decoration:line-through}
.chk-txt{font-size:.9em;line-height:1.45}
.pron{color:var(--teal);font-weight:700}
.cd-hero{background:var(--card);border-radius:0 13px 13px 0;box-shadow:var(--shadow);padding:20px;text-align:center;margin-bottom:10px;border-left:4px solid var(--red)}
.cd-big{font-family:var(--font-jp);font-size:2.4em;font-weight:700;color:var(--red);line-height:1.1}
.cd-unit{font-size:.4em;color:var(--muted);font-weight:500}
.cd-sub{font-size:.85em;color:var(--muted);margin-top:4px}
.cd-pill{display:inline-block;font-size:.7em;font-weight:700;padding:2px 8px;border-radius:12px;background:#e8e5de;color:var(--muted);vertical-align:middle}
.cd-pill.cd-soon{background:var(--gold);color:#fff}
.cd-pill.cd-past{background:#ece8e1;color:#b0a89c}
/* Print button */
.print-btn{font-family:var(--font);background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:.82em;font-weight:600;padding:8px 16px;border-radius:8px;transition:.2s}
.print-btn:hover{border-color:var(--indigo);color:var(--indigo)}
/* Print / PDF */
@media print{
  body{padding:0;background:#fff;color:#000;font-size:11pt}
  .tabs,.day-nav,.noprint,.rc-actions,.link-btn,.link-rm,.chk-wrap,.print-btn,.ibtn,.day-collage,.img-credits,.dmenu-btn,.dmenu-pop,.toast,.tz-clock{display:none!important}
  .pnl{display:block!important;max-width:none;margin:0}
  .pnl#p1,.pnl#p2,.pnl#p3{page-break-before:always}
  .dc{box-shadow:none;border:1px solid #ccc;background:transparent}
  .rc,.info-card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  .sr{break-inside:avoid}
  .dh{break-after:avoid}
  .pdiv{break-after:avoid;margin:14px 0 10px}
  .hdr{margin:0 0 12px;padding:0 0 10px;background:none}
  .dc,.sdot::before,.dh .dnum b,.pdiv .mon{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:#000;text-decoration:none}
  .chart-wrap{height:auto}
  .tip-d{display:block;background:transparent!important;border-left:2px solid #bbb;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tip-d[open]{background:transparent!important}
  .tip-s{color:#000;cursor:default;font-size:9.5pt}
  .tip-s::before{content:'•';color:#000}
  .tip-d[open] .tip-s::before{transform:none}
  .tip-b{color:#222;font-size:9.5pt}
}
/* Ciekawostki (collapsible tips in plan) */
.tip-d{margin:6px 0 2px;border-left:2px dashed var(--kin);border-radius:0 8px 8px 0;background:#fdf6e7}
.tip-d[open]{background:#f9efd8}
.tip-s{cursor:pointer;padding:6px 11px;color:#9a7a25;font-weight:700;font-size:.84em;list-style:none;display:flex;align-items:center;gap:7px;user-select:none}
.tip-s::-webkit-details-marker{display:none}
.tip-s::marker{display:none;content:''}
.tip-s::after{content:'';margin-left:auto;flex:none;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--kin);transition:transform .2s}
.tip-d[open] .tip-s::after{transform:rotate(180deg)}
.tip-b{padding:3px 11px 9px 11px;font-size:.9em;color:var(--muted);line-height:1.6}
/* ── Tryb „TERAZ" — bieżący dzień i punkt planu ── */
.today-pill{display:inline-block;font-size:.62em;font-weight:700;background:var(--red);color:#fff;border-radius:12px;padding:2px 9px;margin-left:8px;vertical-align:middle;letter-spacing:.09em}
.sr-past{opacity:.5}
.sr-now{background:linear-gradient(90deg,rgba(184,64,47,.08),transparent 70%);border-radius:10px}
.sr-now .sdot::before{background:var(--red);animation:nowPulse 2.2s ease-in-out infinite}
@keyframes nowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.now-pill{position:fixed;right:14px;bottom:14px;z-index:60;display:none;align-items:center;gap:10px;max-width:min(80vw,420px);background:var(--card);border:1px solid var(--border);border-left:4px solid var(--red);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:9px 14px;cursor:pointer;font-family:var(--font)}
.now-pill:hover{filter:brightness(1.03)}

.now-pill .np-t{font-size:.8em;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Głosowe rozmówki ── */
.say-btn{background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.62em;padding:3px 10px;vertical-align:middle;margin-left:9px;transition:.15s;line-height:1.5}

<script>
const TAB_NAMES=['plan','terminy','dystanse','zakupy','wazne','pakowanie','jedzenie','rozmowki'];
function sw(i){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j===i));document.querySelectorAll('.pnl').forEach((p,j)=>p.classList.toggle('on',j===i));const np=document.getElementById('nowPill');if(np)np.style.display=(i===0&&np.dataset.has==='1')?'flex':'none'}
function selectTab(i){sw(i);try{history.replaceState(null,'','#'+TAB_NAMES[i])}catch(e){location.hash=TAB_NAMES[i]}}
function tabFromHash(){const h=decodeURIComponent(location.hash.slice(1));if(/^d\d+$/.test(h))return 0;const i=TAB_NAMES.indexOf(h);return i>=0?i:0}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function pc(t){const l=t.toLowerCase();if(l.includes('kioto')||l.includes('osaka')||l.includes('nara'))return'1';if(l.includes('alpy')||l.includes('nagano'))return'2';return'3'}

// Sekcja TERMINY: jedna lista wpisów, każdy z własną datą. `kind` decyduje o szablonie —
// 'res' (4 pola, ma DX) dostaje checkbox + rozwijane szczegóły, 'evt' (3 pola) to samo
// wydarzenie na osi czasu bez checkboxa.
const RES_MONTHS={'2026-06':'Czerwiec 2026','2026-07':'Lipiec 2026','2026-08':'Sierpień 2026 — w trakcie podróży'};
const PL_M=['','stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
function fmtPlDate(sd){const p=sd.split('-');return (+p[2])+' '+PL_M[+p[1]]}

function parse(text){
  const lines=text.split('\n'),meta={},items=[],parts=[],info=[],pack=[],food=[],shop=[],phrases=[],tips=[];
  let sec='',cp=null,cd=null,resCount=0;
  for(const raw of lines){
    const t=raw.trim();
    if(t.startsWith('### ')){sec=t.slice(4).trim();continue}
    if(sec==='META'){const m=t.match(/^(\w+):\s*(.+)$/);if(m)meta[m[1]]=m[2];continue}
    if(sec==='TERMINY'){
      if(!t||t.startsWith('#'))continue;
      const p=t.split(' | ');
      if(p.length<3)continue;
      const sd=p[0].trim(),ti=p[1].trim(),sub=p[2].trim();
      if(p.length>=4)items.push({kind:'res',i:resCount++,ti,sd,sub,dx:p[3].trim()});
      else items.push({kind:'evt',ti,sd,sub});
      continue;
    }
    if(sec==='WAZNE'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');info.push({grp:g[0].trim(),lb:(p[0]||'').trim(),dt:(p[1]||'').trim(),mq:(p[2]||'').trim()})}continue}
    if(sec==='PAKOWANIE'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2)pack.push({grp:g[0].trim(),it:g[1].trim()});continue}
    if(sec==='JEDZENIE'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');food.push({grp:g[0].trim(),lb:(p[0]||'').trim(),dt:(p[1]||'').trim(),mq:(p[2]||'').trim()})}continue}
    if(sec==='ZAKUPY'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');shop.push({grp:g[0].trim(),lb:(p[0]||'').trim(),dt:(p[1]||'').trim(),wh:(p[2]||'').trim(),mq:(p[3]||'').trim()})}continue}
    if(sec==='ROZMOWKI'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');phrases.push({grp:g[0].trim(),pl:(p[0]||'').trim(),jp:(p[1]||'').trim(),jpr:(p[2]||'').trim(),pron:(p[3]||'').trim()})}continue}
    if(sec==='CIEKAWOSTKI'){if(!t||t.startsWith('#'))continue;const p=t.split(' | ');if(p.length>=5){const dm=p[0].trim().match(/^D(\d+)$/);if(dm)tips.push({day:+dm[1],tm:p[1].trim(),icon:p[2].trim(),ti:p[3].trim(),dx:p.slice(4).join(' | ').trim()})}continue}
    if(sec==='PLAN'){
      if(t.startsWith('# ')){cp={title:t.slice(2).trim(),days:[]};parts.push(cp);cd=null;continue}
      if(t.startsWith('== ')){const p=t.slice(3).split(' | ');cd={lb:p[0]||'',ds:p[1]||'',ts:p[2]||'',ht:p[3]||'',sm:'',sc:[]};if(cp)cp.days.push(cd);continue}
      if(t.startsWith('- ')&&cd){const p=t.slice(2).split(' | ');cd.sc.push({tm:p[0]||'',ti:p[1]||'',nt:p[2]||'',mq:(p[3]||'').trim()});continue}
      if(t&&cd&&!t.startsWith('#')&&!t.startsWith('==')){cd.sm+=(cd.sm?' ':'')+t;continue}
    }
  }
  return{meta,items,parts,info,pack,food,shop,phrases,tips}
}

const D=parse(PLAN_DATA);
// Cache zdjęć (IndexedDB → object URL); używany przez Zakupy ORAZ portfel QR w Terminach
let IMG_DB=null,IMG_URLS={};
document.getElementById('subtitle').textContent=D.meta.subtitle||'';
document.getElementById('footer').innerHTML=`日本旅行 2026 · Ostatnia aktualizacja: ${esc(D.meta.updated||'?')}`;

// Render reservations with checkboxes + confirmation links (localStorage)
function getResState(){try{return JSON.parse(localStorage.getItem('jp26_res')||'{}')}catch(e){return{}}}
function saveResState(s){localStorage.setItem('jp26_res',JSON.stringify(s))}
function toggleRes(i){const s=getResState();s[i]=s[i]||{};s[i].done=!s[i].done;saveResState(s);renderAllRes()}
function addLink(i){const url=prompt('Wklej link do potwierdzenia:');if(url&&url.trim()){const s=getResState();s[i]=s[i]||{};s[i].link=url.trim();saveResState(s);renderAllRes()}}
function removeLink(i){const s=getResState();if(s[i])s[i].link='';saveResState(s);renderAllRes()}

function fmtRx(s){
  let t=esc(s);
  // Section headers: ▸ MUST HAVE: etc
  t=t.replace(/▸\s*([^:]+):/g,'<div class="rx-section">▸ $1:</div>');
  // Numbered items: ① ② etc - each on its own line
  t=t.replace(/([①②③④⑤⑥⑦⑧⑨⑩⑪⑫])\s*/g,'<div class="rx-item">$1 ');
  // Close items (before next item or section or end)
  const parts=t.split('<div class="rx-item">');
  if(parts.length>1){
    t=parts[0];
    for(let i=1;i<parts.length;i++){t+='<div class="rx-item">'+parts[i]+'</div>';}
  }
  return t;
}

function renderAllRes(){
  const s=getResState();
  const list=D.items.slice().sort((a,b)=>a.sd<b.sd?-1:a.sd>b.sd?1:0);
  let h0='',lastM='';
  if(D.meta.start){const diff=daysUntil(D.meta.start);let big;if(diff>0)big=diff+'<span class="cd-unit"> dni</span>';else if(diff===0)big='dziś! 🎌';else big=(diff>=-21?'Podróż trwa! 🎌':'Po podróży');h0+=`<div class="cd-hero"><div class="cd-big">${big}</div><div class="cd-sub">✈️ do startu podróży (${esc(D.meta.start)})</div></div>`}
  list.forEach(it=>{
    const isEvt=it.kind==='evt';
    const st=isEvt?{}:(s[it.i]||{}),done=st.done,link=st.link;
    const mk=it.sd.slice(0,7),mlab=RES_MONTHS[mk]||esc(it.sd.slice(0,4));
    if(mlab!==lastM){lastM=mlab;h0+=`<div class="res-mh">${esc(mlab)}</div>`}
    const tier=mk==='2026-06'?'rt-now':mk==='2026-07'?'rt-soon':'rt-trip';
    const rel=relText(daysUntil(it.sd));
    const dateTxt=done?'✓ gotowe':(mk==='2026-06'?'teraz':fmtPlDate(it.sd));
    h0+=`<div class="res-it ${tier} ${done?'res-done':''} ${isEvt?'res-evt':''}"><div class="res-dot"></div><div class="res-card">`;
    h0+=`<div class="res-top"><span class="res-date">${esc(dateTxt)}</span><span class="res-left ${done?'dl-done':rel.c}">${done?'✓ gotowe':esc(rel.t)}</span>`;
    if(!isEvt)h0+=`<label class="chk-wrap" title="Odhacz"><input type="checkbox" ${done?'checked':''} onchange="toggleRes(${it.i})"><span class="chk-box"></span></label>`;
    const pkey='res-'+slug(it.ti),purl=(!isEvt&&IMG_URLS[pkey])||'';
    h0+=`</div><div class="res-mid"><div class="res-mid-t"><div class="res-title">${esc(it.ti)}</div>`;
    if(it.sub)h0+=`<div class="res-sub">${esc(it.sub)}</div>`;
    h0+=`</div>`;
    if(purl)h0+=`<button class="res-thumb" style="background-image:url('${purl}')" onclick="openResLightbox('${pkey}')" title="Pokaż bilet / QR na pełnym ekranie"></button>`;
    h0+=`</div>`;
    if(!isEvt){
      h0+=`<details class="res-det"><summary>Szczegóły, link i zdjęcie potwierdzenia</summary><div class="res-detb">${fmtRx(it.dx)}`;
      if(link)h0+=`<div class="rc-link"><a href="${esc(link)}" target="_blank" rel="noopener">📎 Potwierdzenie</a> <button class="link-rm" onclick="removeLink(${it.i})">✕</button></div>`;
      h0+=`<div class="rc-actions"><button class="link-btn" onclick="addLink(${it.i})">${link?'🔄 Zmień link':'📎 Dodaj link potwierdzenia'}</button> <button class="link-btn" onclick="pickResPhoto('${pkey}')">${purl?'🖼️ Zmień zdjęcie/QR':'🖼️ Dodaj zdjęcie / QR'}</button></div>`;
      h0+=`</div></details>`;
    }
    h0+=`</div></div>`;
  });
  document.getElementById('p0').innerHTML=h0;
}
renderAllRes();

// Render "Ważne" (important info) tab — z polami edytowalnymi (localStorage, tylko na tym urządzeniu)
const INFO_PH={};
function getInfoState(){try{return JSON.parse(localStorage.getItem('jp26_info')||'{}')}catch(e){return{}}}
function saveInfoState(s){localStorage.setItem('jp26_info',JSON.stringify(s))}
function editInfo(k){const s=getInfoState();const v=prompt('Wpisz: '+(INFO_PH[k]||'wartość')+'\n(zapis tylko w tej przeglądarce; wyczyść = puste pole)',s[k]||'');if(v===null)return;const t=v.trim();if(t)s[k]=t;else delete s[k];saveInfoState(s);renderInfo()}
function fmtField(escHtml){const s=getInfoState();return escHtml.replace(/\[\[([a-z0-9_]+)\|([^\]]+)\]\]/g,(m,k,ph)=>{const v=s[k];return v?`<span class="ival">${esc(v)}</span> <button class="ibtn" title="Edytuj" onclick="editInfo('${k}')">✏️</button>`:`<button class="ibtn ibtn-add" onclick="editInfo('${k}')">✏️ ${ph}</button>`})}
const INFO_MON={'Telefony alarmowe':['緊','p-1'],'Hotele':['宿','p-2'],'Dokumenty i rezerwacje':['書','p-3'],'Na wszelki wypadek (spokojnie — to tylko checklist)':['安','p-gold']};
function renderInfo(){
  let h3='<div class="info-warn">⚠️ <strong>Bezpieczeństwo:</strong> pola edytowalne (✏️) zapisują się <strong>tylko w tej przeglądarce</strong> — nie trafiają do repo. Mimo to nie wpisuj numerów kart płatniczych ani PIN-ów. Skany dokumentów trzymaj w osobnym, zabezpieczonym miejscu.</div>';
  let lastGrp='';
  D.info.forEach(it=>{
    let mm;const rx=/\[\[([a-z0-9_]+)\|([^\]]+)\]\]/g;while((mm=rx.exec(it.dt)))INFO_PH[mm[1]]=mm[2];
    if(it.grp!==lastGrp){lastGrp=it.grp;const mon=INFO_MON[it.grp]||['•','p-gold'];h3+=`<div class="ck-grp ${mon[1]}"><span class="ck-mon">${esc(mon[0])}</span><span class="ck-gt2">${esc(it.grp)}</span></div>`}
    let det=fmtField(esc(it.dt));
    if(it.mq)det+=` · <a class="mlink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.mq)}" target="_blank" rel="noopener">📍 mapa</a>`;
    h3+=`<div class="info-card"><div class="il">${esc(it.lb)}</div><div class="ix">${det}</div></div>`;
  });
  document.getElementById('p3').innerHTML=h3;
}
renderInfo();

// Format a schedule note: emphasise the opening-hours (🕐) segment
function fmtNote(n){const e=esc(n);const i=e.indexOf('🕐');return i<0?e:e.slice(0,i)+'<span class="hrs">'+e.slice(i)+'</span>'}

function parseDayBlock(text){
  let cd=null;
  text.split('\n').forEach(raw=>{
    const t=raw.trim();
    if(!t||t.startsWith('#'))return;
    if(t.startsWith('== ')){const p=t.slice(3).split(' | ');cd={lb:p[0]||'',ds:p[1]||'',ts:p[2]||'',ht:p[3]||'',sm:'',sc:[]};return}
    if(t.startsWith('- ')&&cd){const p=t.slice(2).split(' | ');cd.sc.push({tm:p[0]||'',ti:p[1]||'',nt:p[2]||'',mq:(p[3]||'').trim()});return}
    if(cd)cd.sm+=(cd.sm?' ':'')+t;
  });
  return cd;
}
function dayText(cd){

  return t.trim();
}

// Wschód/zachód słońca — liczone lokalnie (równanie wschodu słońca, NOAA), działa offline dla każdej daty
function sunTimes(ds,lat,lon){
  const rad=Math.PI/180,deg=180/Math.PI;
  const Jdate=new Date(ds+'T00:00:00Z').getTime()/86400000+2440587.5;
  const n=Math.round(Jdate-2451545.0+0.0008+lon/360);
  const Jstar=n-lon/360;
  const M=((357.5291+0.98560028*Jstar)%360+360)%360;
  const C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const L=((M+C+180+102.9372)%360+360)%360;
  const Jtransit=2451545.0+Jstar+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*L*rad);
  const sinD=Math.sin(L*rad)*Math.sin(23.4397*rad),cosD=Math.cos(Math.asin(sinD));
  const cosW=(Math.sin(-0.833*rad)-Math.sin(lat*rad)*sinD)/(Math.cos(lat*rad)*cosD);
  if(cosW<-1||cosW>1)return null;
  const w=Math.acos(cosW)*deg;
  const f=j=>new Intl.DateTimeFormat('pl-PL',{timeZone:'Asia/Tokyo',hour:'numeric',minute:'2-digit'}).format(new Date((j-2440587.5)*86400000));
  return{rise:f(Jtransit-w/360),set:f(Jtransit+w/360)};
}
function getWxCache(){try{return JSON.parse(localStorage.getItem('jp26_wx')||'{}')}catch(e){return{}}}
function dayMetaLine(dnum){
  const n=+dnum;const g=DAY_GEO[n];if(!g||!dnum)return'';
  const ds=dayDate(n);if(!ds)return'';
  const sun=sunTimes(ds,g[0],g[1]);
  let h=sun?`🌅 ${sun.rise} · 🌇 ${sun.set}`:'';
  const wx=(getWxCache().d||{})[n];
  if(wx&&wx.tx!=null)h+=`${h?' &nbsp;·&nbsp; ':''}🌡️ ${Math.round(wx.tx)}°/${Math.round(wx.tn)}°${wx.pp!=null?' · ☔ '+Math.round(wx.pp)+'%':''}`;
  return h?`<div class="dwx" title="Wschód i zachód słońca (obliczane) · prognoza: Open-Meteo, odświeżana gdy jest internet">${h}</div>`:'';
}
