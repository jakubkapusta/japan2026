- 14:00 | 🚕 Kyoto Station → hotel taksówką (~10 min, ~1 000 ¥) | Z 3 walizkami pokładowymi to najwygodniej. Postój taxi na wyjściu Hachijo (południowe).

</div>

<div class="ft" id="footer"></div>

<script>
const TAB_NAMES=['rezerwacje','plan','dystanse','wazne','pakowanie','jedzenie','rozmowki','terminy'];
function sw(i){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j===i));document.querySelectorAll('.pnl').forEach((p,j)=>p.classList.toggle('on',j===i))}
function selectTab(i){sw(i);try{history.replaceState(null,'','#'+TAB_NAMES[i])}catch(e){location.hash=TAB_NAMES[i]}}
function tabFromHash(){const h=decodeURIComponent(location.hash.slice(1));if(/^d\d+$/.test(h))return 1;const i=TAB_NAMES.indexOf(h);return i>=0?i:0}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function uc(u){const l=u.toLowerCase();if(l==='teraz')return{bl:'bl-r',bdg:'bdg-now',lb:'Teraz'};if(l==='czerwiec')return{bl:'bl-g',bdg:'bdg-soon',lb:'Czerwiec'};if(l==='lipiec')return{bl:'bl-t',bdg:'bdg-july',lb:'Lipiec'};return{bl:'bl-n',bdg:'bdg-none',lb:u}}
function pc(t){const l=t.toLowerCase();if(l.includes('kioto')||l.includes('osaka')||l.includes('nara'))return'1';if(l.includes('alpy')||l.includes('nagano'))return'2';return'3'}

function parse(text){
  const lines=text.split('\n'),meta={},res=[],parts=[],info=[],pack=[],food=[],phrases=[],milestones=[];
  let sec='',cp=null,cd=null;
  for(const raw of lines){
    const t=raw.trim();
    if(t.startsWith('### ')){sec=t.slice(4).trim();continue}
    if(sec==='META'){const m=t.match(/^(\w+):\s*(.+)$/);if(m)meta[m[1]]=m[2];continue}
    if(sec==='REZERWACJE'){if(!t||t.startsWith('#'))continue;const p=t.split(' | ');if(p.length>=4)res.push({ti:p[0].trim(),ur:p[1].trim(),dt:p[2].trim(),dx:p[3].trim()});continue}
    if(sec==='WAZNE'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');info.push({grp:g[0].trim(),lb:(p[0]||'').trim(),dt:(p[1]||'').trim(),mq:(p[2]||'').trim()})}continue}
    if(sec==='PAKOWANIE'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2)pack.push({grp:g[0].trim(),it:g[1].trim()});continue}
    if(sec==='JEDZENIE'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');food.push({grp:g[0].trim(),lb:(p[0]||'').trim(),dt:(p[1]||'').trim()})}continue}
    if(sec==='ROZMOWKI'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');phrases.push({grp:g[0].trim(),pl:(p[0]||'').trim(),jp:(p[1]||'').trim(),pron:(p[2]||'').trim()})}continue}
    if(sec==='ODLICZANIE'){if(!t||t.startsWith('#'))continue;const p=t.split(' | ');if(p.length>=2)milestones.push({date:p[0].trim(),lb:(p[1]||'').trim(),dt:(p[2]||'').trim()});continue}
    if(sec==='PLAN'){
      if(t.startsWith('# ')){cp={title:t.slice(2).trim(),days:[]};parts.push(cp);cd=null;continue}
      if(t.startsWith('== ')){const p=t.slice(3).split(' | ');cd={lb:p[0]||'',ds:p[1]||'',ts:p[2]||'',ht:p[3]||'',sm:'',sc:[]};if(cp)cp.days.push(cd);continue}
      if(t.startsWith('- ')&&cd){const p=t.slice(2).split(' | ');cd.sc.push({tm:p[0]||'',ti:p[1]||'',nt:p[2]||'',mq:(p[3]||'').trim()});continue}
      if(t&&cd&&!t.startsWith('#')&&!t.startsWith('==')){cd.sm+=(cd.sm?' ':'')+t;continue}
    }
  }
  return{meta,res,parts,info,pack,food,phrases,milestones}
}

const D=parse(PLAN_DATA);
document.getElementById('subtitle').textContent=D.meta.subtitle||'';
document.getElementById('footer').innerHTML=`日本旅行 2026 · Ostatnia aktualizacja: ${esc(D.meta.updated||'?')}<br><span style="font-size:.9em;opacity:.7">Kursywa = dni do rozpisania</span>`;

// Render reservations with checkboxes + confirmation links (localStorage)
function getResState(){try{return JSON.parse(localStorage.getItem('jp26_res')||'{}')}catch(e){return{}}}
function saveResState(s){localStorage.setItem('jp26_res',JSON.stringify(s))}
function toggleRes(i){const s=getResState();s[i]=s[i]||{};s[i].done=!s[i].done;saveResState(s);renderAllRes()}
function addLink(i){const url=prompt('Wklej link do potwierdzenia:');if(url&&url.trim()){const s=getResState();s[i]=s[i]||{};s[i].link=url.trim();saveResState(s);renderAllRes()}}
function removeLink(i){const s=getResState();if(s[i])s[i].link='';saveResState(s);renderAllRes()}

function fmtRx(s){
  let t=esc(s);
  // Section headers: ▸ MUST HAVE: etc
  t=t.replace(/▸\s*([^:]+):/g,'<div class="rx-section">▸ $1:</div>');
  // Numbered items: ① ② etc - each on its own line
  t=t.replace(/([①②③④⑤⑥⑦⑧⑨⑩⑪⑫])\s*/g,'<div class="rx-item">$1 ');
  // Close items (before next item or section or end)
  const parts=t.split('<div class="rx-item">');
  if(parts.length>1){
    t=parts[0];
    for(let i=1;i<parts.length;i++){t+='<div class="rx-item">'+parts[i]+'</div>';}
  }
  return t;
}

function renderAllRes(){
  const s=getResState();
  let h0='<div class="sl">Do załatwienia przed wyjazdem</div>';
  D.res.forEach((r,i)=>{
    const u=uc(r.ur);
    const st=s[i]||{};
    const done=st.done;
    const link=st.link;
    const doneClass=done?'rc-done':'';
    h0+=`<div class="rc ${u.bl} ${doneClass}">`;
    h0+=`<div class="rh"><label class="chk-wrap"><input type="checkbox" ${done?'checked':''} onchange="toggleRes(${i})"><span class="chk-box"></span></label><span class="rt">${esc(r.ti)}</span><span class="bdg ${done?'bdg-done':u.bdg}">${done?'✓ Gotowe':esc(u.lb)}</span></div>`;
    h0+=`<div class="rd">${esc(r.dt)}</div>`;
    h0+=`<div class="rx">${fmtRx(r.dx)}</div>`;
    if(link){h0+=`<div class="rc-link"><a href="${esc(link)}" target="_blank" rel="noopener">📎 Potwierdzenie</a><button class="link-rm" onclick="removeLink(${i})">✕</button></div>`}
    h0+=`<div class="rc-actions"><button class="link-btn" onclick="addLink(${i})">${link?'🔄 Zmień link':'📎 Dodaj link potwierdzenia'}</button></div>`;
    h0+=`</div>`;
  });
  document.getElementById('p0').innerHTML=h0;
}
renderAllRes();

// Render "Ważne" (important info) tab — z polami edytowalnymi (localStorage, tylko na tym urządzeniu)
const INFO_PH={};
function getInfoState(){try{return JSON.parse(localStorage.getItem('jp26_info')||'{}')}catch(e){return{}}}
function saveInfoState(s){localStorage.setItem('jp26_info',JSON.stringify(s))}
function editInfo(k){const s=getInfoState();const v=prompt('Wpisz: '+(INFO_PH[k]||'wartość')+'\n(zapis tylko w tej przeglądarce; wyczyść = puste pole)',s[k]||'');if(v===null)return;const t=v.trim();if(t)s[k]=t;else delete s[k];saveInfoState(s);renderInfo()}
function fmtField(escHtml){const s=getInfoState();return escHtml.replace(/\[\[([a-z0-9_]+)\|([^\]]+)\]\]/g,(m,k,ph)=>{const v=s[k];return v?`<span class="ival">${esc(v)}</span> <button class="ibtn" title="Edytuj" onclick="editInfo('${k}')">✏️</button>`:`<button class="ibtn ibtn-add" onclick="editInfo('${k}')">✏️ ${ph}</button>`})}
function renderInfo(){
  let h3='<div class="info-warn">⚠️ <strong>Bezpieczeństwo:</strong> pola edytowalne (✏️) zapisują się <strong>tylko w tej przeglądarce</strong> — nie trafiają do repo. Mimo to nie wpisuj numerów kart płatniczych ani PIN-ów. Skany dokumentów trzymaj w osobnym, zabezpieczonym miejscu.</div>';
  let lastGrp='';
  D.info.forEach(it=>{
    let mm;const rx=/\[\[([a-z0-9_]+)\|([^\]]+)\]\]/g;while((mm=rx.exec(it.dt)))INFO_PH[mm[1]]=mm[2];
    if(it.grp!==lastGrp){lastGrp=it.grp;h3+=`<div class="info-grp">${esc(it.grp)}</div>`}
    let det=fmtField(esc(it.dt));
    if(it.mq)det+=` · <a class="mlink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.mq)}" target="_blank" rel="noopener">📍 mapa</a>`;
    h3+=`<div class="info-card"><div class="il">${esc(it.lb)}</div><div class="ix">${det}</div></div>`;
  });
  document.getElementById('p3').innerHTML=h3;
}
renderInfo();

// Format a schedule note: emphasise the opening-hours (🕐) segment
function fmtNote(n){const e=esc(n);const i=e.indexOf('🕐');return i<0?e:e.slice(0,i)+'<span class="hrs">'+e.slice(i)+'</span>'}

// Render plan
let h1='',nav='<div class="day-nav">',dayNum=0;
D.parts.forEach(part=>{
  const c=pc(part.title);
  h1+=`<div class="pdiv"><div class="ln bg${c}"></div><div class="lb c${c}">${esc(part.title)}</div><div class="ln bg${c}"></div></div>`;
  part.days.forEach(d=>{
    dayNum++;
    nav+=`<a class="bg${c}" href="#d${dayNum}">D${dayNum}</a>`;
    const has=d.sc.length>0,tbd=has?'':'tbd',label=d.ts?d.lb+' · '+d.ts:d.lb;
    h1+=`<div class="dc" id="d${dayNum}"><div class="dh bg${c}"><span class="dn">${esc(label)}</span><span class="dd">${esc(d.ds)}</span></div><div class="db ${tbd}"><div class="ds">${esc(d.sm)}</div>`;
    if(has){h1+='<div class="sch">';d.sc.forEach(s=>{const ti=s.mq?`<a class="mlink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.mq)}" target="_blank" rel="noopener">${esc(s.ti)}</a>`:esc(s.ti);h1+=`<div class="sr"><div class="st">${esc(s.tm)}</div><div class="sc"><strong>${ti}</strong>${s.nt?'<br><span class="n">'+fmtNote(s.nt)+'</span>':''}</div></div>`});h1+='</div>'}
    const htLink=/lot powrotny/i.test(d.ht)?esc(d.ht):`<a class="mlink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.ht)}" target="_blank" rel="noopener">${esc(d.ht)}</a>`;
    h1+=`<div class="dht">🏨 ${htLink}</div></div></div>`;
  });
});
document.getElementById('p1').innerHTML=nav+'</div>'+h1;

// Render stats tab
const DAYS=[
{d:1,n:'Przylot + Gion',walk:4,metro:0,car:0,train:75,part:1},
{d:2,n:'Kiyomizu + Fushimi nocą',walk:14,metro:10,car:0,train:0,part:1},
{d:3,n:'Osaka',walk:15,metro:40,car:0,train:100,part:1},
{d:4,n:'Arashiyama + Kinkaku-ji (+teamLab?)',walk:13,metro:80,car:0,train:0,part:1},
{d:5,n:'Uji + Nara',walk:13,metro:0,car:0,train:110,part:1},
{d:6,n:'Kanazawa → Takayama',walk:6,metro:20,car:140,train:105,part:2},
{d:7,n:'Takayama + Hida',walk:6,metro:0,car:10,train:0,part:2},
{d:8,n:'Kamikōchi',walk:14,metro:0,car:80,train:0,part:2},
{d:9,n:'Matsumoto → Nagano',walk:5,metro:0,car:160,train:0,part:2},
{d:10,n:'Togakushi',walk:8,metro:0,car:90,train:0,part:2},
{d:11,n:'Snow Monkey + Obuse',walk:6,metro:0,car:80,train:0,part:2},
{d:12,n:'Zenkō-ji',walk:6,metro:0,car:0,train:0,part:2},
{d:13,n:'Nagano → Tokio',walk:7,metro:30,car:0,train:80,part:3},
{d:14,n:'teamLab + Asakusa',walk:12,metro:60,car:0,train:0,part:3},
{d:15,n:'Akiba + Samurai + Shinjuku',walk:13,metro:30,car:0,train:0,part:3},
{d:16,n:'Meiji Jingu + Shibuya',walk:12.5,metro:20,car:0,train:0,part:3},
{d:17,n:'Fukagawa Matsuri + Yanaka',walk:12,metro:80,car:0,train:0,part:3},
{d:18,n:'Zakupy',walk:7,metro:30,car:0,train:0,part:3},
{d:19,n:'Kamakura + Enoshima',walk:14,metro:0,car:0,train:150,part:3},
{d:20,n:'Lot powrotny',walk:3,metro:0,car:0,train:40,part:3}
];
const totalWalk=DAYS.reduce((s,d)=>s+d.walk,0);
const totalCar=DAYS.reduce((s,d)=>s+d.car,0);
const totalTrain=DAYS.reduce((s,d)=>s+d.train,0);
const avgWalk=Math.round(totalWalk/DAYS.length*10)/10;
const maxWalk=Math.max(...DAYS.map(d=>d.walk));
const maxDay=DAYS.find(d=>d.walk===maxWalk);

const partNames={1:'Kioto / Osaka / Nara',2:'Alpy / Nagano',3:'Tokio'};
const partColors={1:'var(--red)',2:'var(--teal)',3:'var(--indigo)'};

let h2='<div class="stats-grid">';
h2+=`<div class="stat-card"><div class="stat-label">Łącznie pieszo</div><div class="stat-val teal">${Math.round(totalWalk)} km</div></div>`;
h2+=`<div class="stat-card"><div class="stat-label">Średnio dziennie</div><div class="stat-val indigo">${avgWalk} km</div></div>`;
h2+=`<div class="stat-card"><div class="stat-label">Max dzień (D${maxDay.d})</div><div class="stat-val red">${maxWalk} km</div></div>`;
h2+=`<div class="stat-card"><div class="stat-label">Autem łącznie</div><div class="stat-val gold">${totalCar} km</div></div>`;
h2+='</div>';

// Inline SVG bar chart (offline, no CDN) — daily walking km
function buildChart(days){
  const PL=34,PR=10,PT=10,PB=20,PH=230,slot=100/days.length;
  const W=560,H=PH+PT+PB,plotW=W-PL-PR,sw=plotW/days.length,bw=Math.min(sw-7,22),MAX=20;
  const y=v=>PT+PH-(v/MAX*PH);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="${'DM Sans,system-ui,sans-serif'}">`;
  // y gridlines + labels
  [0,5,10,15,20].forEach(v=>{const yy=y(v);s+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="rgba(128,128,128,0.12)" stroke-width="1"/>`;s+=`<text x="${PL-5}" y="${yy+3}" text-anchor="end" font-size="9" fill="#6b6b6b">${v}${v===20?' km':''}</text>`});
  // threshold reference lines
  [[15,'#E24B4A'],[12,'#EF9F27']].forEach(([v,c])=>{const yy=y(v);s+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="${c}" stroke-width="1" stroke-dasharray="6 4"/>`});
  // bars + x labels
  days.forEach((d,i)=>{const cx=PL+i*sw+(sw-bw)/2,h=d.walk/MAX*PH,c=d.walk>=15?'#E24B4A':d.walk>=12?'#EF9F27':'#1D9E75';s+=`<rect x="${cx.toFixed(1)}" y="${y(d.walk).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${c}"/>`;s+=`<text x="${(PL+i*sw+sw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="8" fill="#6b6b6b">D${d.d}</text>`});
  return s+'</svg>';
}
h2+='<div class="chart-wrap">'+buildChart(DAYS)+'</div>';
h2+='<div class="legend-row"><span><span class="legend-dot" style="background:#1D9E75"></span> pieszo (km)</span><span><span class="legend-dot" style="background:#EF9F27;width:10px;height:2px;border-radius:0"></span> 12+ km (dużo)</span><span><span class="legend-dot" style="background:#E24B4A;width:10px;height:2px;border-radius:0"></span> 15+ km (bardzo dużo)</span></div>';

h2+='<div class="sl" style="margin-top:28px">Szczegóły dzień po dniu</div>';
h2+='<table class="dist-tbl"><thead><tr><th>Dzień</th><th>Miejsce</th><th class="r">Pieszo</th><th class="r">Metro/bus</th><th class="r">Auto</th><th class="r">Pociąg</th></tr></thead><tbody>';

let lastPart=0;
DAYS.forEach(d=>{
  if(d.part!==lastPart){
    lastPart=d.part;
    h2+=`<tr class="part-row"><td colspan="6">${esc(partNames[d.part])}</td></tr>`;
  }
  const cls=d.walk>=15?'km-hi':d.walk>=12?'km-mid':'';
  h2+=`<tr${d.walk>=14?' class="warn"':''}><td>${d.d}</td><td>${esc(d.n)}</td><td class="r ${cls}">${d.walk} km</td><td class="r">${d.metro?d.metro+' min':'—'}</td><td class="r">${d.car?d.car+' km':'—'}</td><td class="r">${d.train?d.train+' min':'—'}</td></tr>`;
});
h2+=`<tr style="border-top:2px solid var(--border);font-weight:700"><td colspan="2">RAZEM</td><td class="r">${Math.round(totalWalk)} km</td><td class="r">${DAYS.reduce((s,d)=>s+d.metro,0)} min</td><td class="r">${totalCar} km</td><td class="r">${totalTrain} min</td></tr>`;
h2+='</tbody></table>';
document.getElementById('p2').innerHTML=h2;

// Checklisty (Pakowanie #p4, Jedzenie #p5) — generyczne, localStorage
function getChk(store){try{return JSON.parse(localStorage.getItem(store)||'{}')}catch(e){return{}}}
function saveChk(store,s){localStorage.setItem(store,JSON.stringify(s))}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9ąćęłńóśźż]+/g,'-').replace(/^-|-$/g,'').slice(0,48)}
function toggleCheck(store,key){const s=getChk(store);s[key]=!s[key];saveChk(store,s);store==='jp26_pack'?renderPack():renderFood()}
function renderChecklist(items,store,panelId,withDesc){
  const s=getChk(store);let h='',lastGrp='';
  const done=items.filter(it=>s[slug(it.lb||it.it)]).length;
  h+=`<div class="sl">Odhaczone: ${done} / ${items.length}</div>`;
  items.forEach(it=>{
    if(it.grp!==lastGrp){lastGrp=it.grp;h+=`<div class="info-grp">${esc(it.grp)}</div>`}
    const label=it.lb||it.it,key=slug(label),ck=!!s[key];
    h+=`<div class="chk-row ${ck?'chk-on':''}" onclick="toggleCheck('${store}','${key}')"><span class="chk-box2">${ck?'✓':''}</span><span class="chk-txt"><strong>${esc(label)}</strong>${withDesc&&it.dt?' — <span class="n">'+esc(it.dt)+'</span>':''}</span></div>`;
  });
  document.getElementById(panelId).innerHTML=h;
}
function renderPack(){renderChecklist(D.pack,'jp26_pack','p4',false)}
function renderFood(){renderChecklist(D.food,'jp26_food','p5',true)}
renderPack();renderFood();

// Rozmówki (#p6)
function renderPhrases(){
  let h='',lastGrp='';
  D.phrases.forEach(p=>{
    if(p.grp!==lastGrp){lastGrp=p.grp;h+=`<div class="info-grp">${esc(p.grp)}</div>`}
    h+=`<div class="info-card"><div class="il">${esc(p.pl)}</div><div class="ix">${esc(p.jp)} · <span class="pron">「${esc(p.pron)}」</span></div></div>`;
  });

}
renderPhrases();

// Terminy / odliczanie (#p7) + licznik w nagłówku
function daysUntil(dateStr){const d=new Date(dateStr+'T00:00:00'),t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000)}
function relText(diff){if(diff>1)return{t:'za '+diff+' dni',c:''};if(diff===1)return{t:'jutro',c:'cd-soon'};if(diff===0)return{t:'dziś',c:'cd-soon'};return{t:'minęło '+(-diff)+' dni',c:'cd-past'}}
function renderCountdown(){
  let h='';
  if(D.meta.start){const diff=daysUntil(D.meta.start);let big;if(diff>0)big=diff+'<span class="cd-unit"> dni</span>';else if(diff===0)big='dziś! 🎌';else big=(diff>=-19?'Podróż trwa! 🎌':'Po podróży');h+=`<div class="cd-hero"><div class="cd-big">${big}</div><div class="cd-sub">✈️ do startu podróży (${esc(D.meta.start)})</div></div>`}
  h+='<div class="info-grp">Kluczowe terminy</div>';
  D.milestones.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(m=>{const r=relText(daysUntil(m.date));h+=`<div class="info-card"><div class="il">${esc(m.lb)} <span class="cd-pill ${r.c}">${r.t}</span></div><div class="ix">${esc(m.date)}${m.dt?' · '+esc(m.dt):''}</div></div>`});
  document.getElementById('p7').innerHTML=h;
}
renderCountdown();
(function(){const el=document.getElementById('cdHead');if(!el||!D.meta.start)return;const diff=daysUntil(D.meta.start);if(diff>0)el.textContent='✈️ Do wylotu: '+diff+(diff===1?' dzień':' dni');else if(diff===0)el.textContent='✈️ Dziś start podróży! 🎌';else if(diff>=-19)el.textContent='🎌 Podróż trwa — miłego zwiedzania!';else el.style.display='none';})();

// Restore active tab from URL hash on load (#plan / #dystanse / #wazne / #dN)
(function(){
  const idx=tabFromHash();
  if(idx!==0)sw(idx);
  const h=location.hash.slice(1);
  if(/^d\d+$/.test(h)){const el=document.getElementById(h);if(el)requestAnimationFrame(()=>el.scrollIntoView())}
})();
</script>
