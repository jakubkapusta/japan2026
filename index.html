D1 | 16:30 | 💡 | Jak spotkać maiko w Gion | Najlepsza szansa na spotkanie maiko (praktykujących gejsz) to ok. 17:45–18:15 na Hanamikoji-dori, gdy idą do okiya na wieczorne przyjęcia. Poruszają się szybko w drewnianych okobo — nie zagradzajcie drogi i nie róbcie zdjęć z bliska bez pozwolenia. Gejsze w Kioto nazywane są „geiko" (nie „gejsza" — to tokijskie słowo).

D19 | 10:30 | 📖 | Drzewo, które widziało zabójstwo | Tu w 1219 r. zamordowano trzeciego szoguna Sanetomo — zabójca (jego własny bratanek, mnich) czekał ukryty za wielkim drzewem ginkgo przy schodach. To 1000-letnie drzewo stało aż do 2010 r., gdy przewróciła je burza. Z pnia wyrosły nowe pędy — Japończycy potraktowali to jako symbol odrodzenia i drzewo „żyje" dalej. Świątynię założył Minamoto Yoritomo, pierwszy szogun, który uczynił Kamakurę stolicą Japonii (1192).
D19 | 12:00 | 🎭 | Kannon z jednego drzewa | Hase-dera szczyci się 9-metrowym, pozłacanym posągiem 11-głowej Kannon — jednym z największych drewnianych posągów w Japonii. Legenda: w 721 r. z jednego pnia kamfory wyrzeźbiono dwie identyczne Kannon. Jedną wrzucono do morza z modlitwą — po 15 latach przypłynęła do brzegu pod Kamakurą i tak powstała ta świątynia. Latem stoki obsadzone są tysiącami hortensji (ajisai).
D19 | 14:15 | 💡 | Enoden — pociąg z anime | Linia Enoden (od 1902) to jedna z najstarszych kolejek w Japonii — sunie tak blisko domów, że niemal zagląda ludziom w okna i przejeżdża przez prywatne podwórka. Przystanek Kamakurakōkō-mae z przejazdem nad morzem to jedno z najsłynniejszych miejsc anime „Slam Dunk" — fani (głównie z Tajwanu i Chin) ustawiają się tu z aparatami. W pogodny dzień widać stąd Fuji nad oceanem.
D7 | 11:45 | 🎭 | „Nagi festiwal" Furukawy | Furukawa słynie z dzikiego Okoshi Daiko (kwiecień): setki mężczyzn w samych przepaskach fundoshi walczy nocą o to, by przypiąć swój mały bęben do gigantycznego bębna niesionego na platformie. To jeden z najbardziej szalonych festiwali Japonii (na liście UNESCO). Zdobione platformy yatai stoją przez resztę roku w hali Festival Float Hall — można je obejrzeć z bliska.
D7 | 13:15 | 🎬 | Anime, które ożywiło miasteczko | Po premierze „Your Name" (2016 — najbardziej kasowe anime tamtych lat) Furukawę zalały tłumy fanów rozpoznających stację, bibliotekę i przystanek z filmu. Reżyser Makoto Shinkai słynie z hiperrealistycznych teł — kadry można nakładać na prawdziwe miejsca niemal 1:1. W bibliotece leży zeszyt dla „pielgrzymów" z całego świata. Lokalna turystyka odżyła dzięki jednemu filmowi.
D9 | 13:30 | 🎬 | Młyny wodne z filmu Kurosawy | Drewniane koła wodne na farmie Daiō zagrały w „Snach" Akiry Kurosawy (1990) jako sielska „wioska młynów" — to jeden z najczęściej fotografowanych kadrów w Azumino. Farma ma ~15 hektarów pól wasabi nawadnianych wodą z topniejących Alp (~120 000 ton dziennie, stałe 13°C). Powstała w 1915 i potrzebowała 20 lat pracy, by ujarzmić podmokły teren. Lody wasabi (łagodne, zaskakująco dobre) to tutejszy hit.
D9 | 13:45 | 🏔️ | Płaski „szczyt" i rzeźby w chmurach | Utsukushigahara („piękna równina") to ewenement — jeden ze „100 słynnych szczytów Japonii", choć zamiast ostrego wierzchołka ma rozległy trawiasty płaskowyż na 2000 m, gdzie od wieków wypasa się krowy. Tutejsze muzeum rzeźby pod gołym niebem (siostra słynnego muzeum w Hakone) wystawia 350+ rzeźb wprost na halach: w pogodny dzień stoją na tle Alp, a we mgle wyłaniają się jak duchy. Samą Venus Line (76 km) budowano jako drogę płatną w latach 1968–81 — dziś bezpłatną i kultową wśród motocyklistów.
D12 | 14:00 | 🎭 | Sanada — klan sześciu monet | Matsushiro było siedzibą rodu Sanada — jednego z najsłynniejszych klanów samurajskich, o herbie „rokumonsen" (sześć monet). Sześć monet to opłata dla przewoźnika dusz za przeprawę przez rzekę śmierci — symbol gotowości na śmierć w każdej bitwie. Sanada Yukimura zasłynął brawurową, ostatnią obroną w bitwie o zamek Osaka (1615) — ten sam zamek, który widzieliście w Dniu 3! Wrogowie nazwali go „największym wojownikiem Japonii".
D20 | 14:00 | 💡 | Skyliner — 160 km/h do miasta | Keisei Skyliner to najszybszy ekspres lotniskowy w Japonii — rozpędza się do 160 km/h i pokonuje trasę Narita–centrum w 36–41 min, szybciej niż słynny Narita Express. Tory na części trasy są standardowego rozstawu (jak Shinkansen), a nie wąskie japońskie — dlatego może jechać tak szybko. Pociągi co 20 min, gwarantowane miejsce, półki na duże walizki.
`;

function sw(i){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j===i));document.querySelectorAll('.pnl').forEach((p,j)=>p.classList.toggle('on',j===i))}

function tabFromHash(){const h=decodeURIComponent(location.hash.slice(1));if(/^d\d+$/.test(h))return 0;const i=TAB_NAMES.indexOf(h);return i>=0?i:0}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function uc(u){const l=u.toLowerCase();if(l==='teraz')return{bl:'bl-r',bdg:'bdg-now',lb:'Teraz'};if(l==='czerwiec')return{bl:'bl-g',bdg:'bdg-soon',lb:'Czerwiec'};if(l==='lipiec')return{bl:'bl-t',bdg:'bdg-july',lb:'Lipiec'};return{bl:'bl-n',bdg:'bdg-none',lb:u}}
function pc(t){const l=t.toLowerCase();if(l.includes('kioto')||l.includes('osaka')||l.includes('nara'))return'1';if(l.includes('alpy')||l.includes('nagano'))return'2';return'3'}

function parse(text){
  const lines=text.split('\n'),meta={},res=[],parts=[],info=[],pack=[],food=[],phrases=[],milestones=[],tips=[];
  let sec='',cp=null,cd=null;
  for(const raw of lines){
    const t=raw.trim();
    if(t.startsWith('### ')){sec=t.slice(4).trim();continue}
    if(sec==='META'){const m=t.match(/^(\w+):\s*(.+)$/);if(m)meta[m[1]]=m[2];continue}
    if(sec==='REZERWACJE'){if(!t||t.startsWith('#'))continue;const p=t.split(' | ');if(p.length>=4)res.push({ti:p[0].trim(),ur:p[1].trim(),dt:p[2].trim(),dx:p[3].trim()});continue}
    if(sec==='WAZNE'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');info.push({grp:g[0].trim(),lb:(p[0]||'').trim(),dt:(p[1]||'').trim(),mq:(p[2]||'').trim()})}continue}
    if(sec==='PAKOWANIE'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2)pack.push({grp:g[0].trim(),it:g[1].trim()});continue}
    if(sec==='JEDZENIE'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');food.push({grp:g[0].trim(),lb:(p[0]||'').trim(),dt:(p[1]||'').trim()})}continue}
    if(sec==='ROZMOWKI'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');phrases.push({grp:g[0].trim(),pl:(p[0]||'').trim(),jp:(p[1]||'').trim(),pron:(p[2]||'').trim()})}continue}
    if(sec==='ODLICZANIE'){if(!t||t.startsWith('#'))continue;const p=t.split(' | ');if(p.length>=2)milestones.push({date:p[0].trim(),lb:(p[1]||'').trim(),dt:(p[2]||'').trim()});continue}
    if(sec==='CIEKAWOSTKI'){if(!t||t.startsWith('#'))continue;const p=t.split(' | ');if(p.length>=5){const dm=p[0].trim().match(/^D(\d+)$/);if(dm)tips.push({day:+dm[1],tm:p[1].trim(),icon:p[2].trim(),ti:p[3].trim(),dx:p.slice(4).join(' | ').trim()})}continue}
    if(sec==='PLAN'){
      if(t.startsWith('# ')){cp={title:t.slice(2).trim(),days:[]};parts.push(cp);cd=null;continue}
      if(t.startsWith('== ')){const p=t.slice(3).split(' | ');cd={lb:p[0]||'',ds:p[1]||'',ts:p[2]||'',ht:p[3]||'',sm:'',sc:[]};if(cp)cp.days.push(cd);continue}
      if(t.startsWith('- ')&&cd){const p=t.slice(2).split(' | ');cd.sc.push({tm:p[0]||'',ti:p[1]||'',nt:p[2]||'',mq:(p[3]||'').trim()});continue}
      if(t&&cd&&!t.startsWith('#')&&!t.startsWith('==')){cd.sm+=(cd.sm?' ':'')+t;continue}
    }
  }
  return{meta,res,parts,info,pack,food,phrases,milestones,tips}
}

function addLink(i){const url=prompt('Wklej link do potwierdzenia:');if(url&&url.trim()){const s=getResState();s[i]=s[i]||{};s[i].link=url.trim();saveResState(s);renderAllRes()}}
function removeLink(i){const s=getResState();if(s[i])s[i].link='';saveResState(s);renderAllRes()}

function fmtRx(s){
  let t=esc(s);
  // Section headers: ▸ MUST HAVE: etc
  t=t.replace(/▸\s*([^:]+):/g,'<div class="rx-section">▸ $1:</div>');
  // Numbered items: ① ② etc - each on its own line
  t=t.replace(/([①②③④⑤⑥⑦⑧⑨⑩⑪⑫])\s*/g,'<div class="rx-item">$1 ');
  // Close items (before next item or section or end)
  const parts=t.split('<div class="rx-item">');
  if(parts.length>1){
    t=parts[0];
    for(let i=1;i<parts.length;i++){t+='<div class="rx-item">'+parts[i]+'</div>';}
  }
  return t;
}

// Inline SVG bar chart (offline, no CDN) — daily walking km
function buildChart(days){
  const PL=34,PR=10,PT=10,PB=20,PH=230,slot=100/days.length;
  const W=560,H=PH+PT+PB,plotW=W-PL-PR,sw=plotW/days.length,bw=Math.min(sw-7,22),MAX=20;
  const y=v=>PT+PH-(v/MAX*PH);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="${'DM Sans,system-ui,sans-serif'}">`;
  // y gridlines + labels
  [0,5,10,15,20].forEach(v=>{const yy=y(v);s+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="rgba(128,128,128,0.12)" stroke-width="1"/>`;s+=`<text x="${PL-5}" y="${yy+3}" text-anchor="end" font-size="9" fill="#6b6b6b">${v}${v===20?' km':''}</text>`});
  // threshold reference lines
  [[15,'#E24B4A'],[12,'#EF9F27']].forEach(([v,c])=>{const yy=y(v);s+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="${c}" stroke-width="1" stroke-dasharray="6 4"/>`});
  // bars + x labels
  days.forEach((d,i)=>{const cx=PL+i*sw+(sw-bw)/2,h=d.walk/MAX*PH,c=d.walk>=15?'#E24B4A':d.walk>=12?'#EF9F27':'#1D9E75';s+=`<rect x="${cx.toFixed(1)}" y="${y(d.walk).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${c}"/>`;s+=`<text x="${(PL+i*sw+sw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="8" fill="#6b6b6b">D${d.d}</text>`});
  return s+'</svg>';
}

  document.getElementById('p7').innerHTML=h;
}
renderCountdown();
(function(){const el=document.getElementById('cdHead');if(!el||!D.meta.start)return;const diff=daysUntil(D.meta.start);if(diff>0)el.textContent='✈️ Do wylotu: '+diff+(diff===1?' dzień':' dni');else if(diff===0)el.textContent='✈️ Dziś start podróży! 🎌';else if(diff>=-19)el.textContent='🎌 Podróż trwa — miłego zwiedzania!';else el.style.display='none';})();

// Restore active tab from URL hash on load (#plan / #dystanse / #wazne / #dN)
(function(){
  const idx=tabFromHash();
  if(idx!==0)sw(idx);
  const h=location.hash.slice(1);
  if(/^d\d+$/.test(h)){const el=document.getElementById(h);if(el)requestAnimationFrame(()=>el.scrollIntoView())}
})();

// Print/PDF: rozwiń wszystkie ciekawostki, żeby trafiły do wydruku, potem przywróć stan na ekranie
window.addEventListener('beforeprint',()=>{document.querySelectorAll('.tip-d:not([open])').forEach(d=>{d.open=true;d.dataset.printopen='1'})});
window.addEventListener('afterprint',()=>{document.querySelectorAll('.tip-d[data-printopen]').forEach(d=>{d.open=false;d.removeAttribute('data-printopen')})});
</script>
</body>
