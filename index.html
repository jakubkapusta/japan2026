Duży dzień logistyczny: pociąg do Kanazawy, ogród Kenroku-en, odbiór auta, Shirakawa-go po drodze, wieczór w Takayamie.
- 7:30 | 🍳 Wczesne wstanie + wymeldowanie z KABIN Minamiza | Śniadanie w konbini po drodze na stację. Walizki ze sobą — dziś zmieniacie bazę!
- 8:15 | 🚶 Gion-Shijo → JR Kyoto Station | Keihan do Tofukuji (~3 min), przesiadka na JR Nara Line do Kyoto Station (~3 min). Albo taksówka z walizkami (~10 min, ~1 000 ¥).
- 8:45 | 🚃 Thunderbird z Kyoto → Tsuruga (~50 min) | Peron 0 (tak, zero — specjalny peron Thunderbirda!). Pociąg w pełni z rezerwacją miejsc. Kupiony wcześniej na JR West (od 5 lipca).
- 9:40 | 🚅 Przesiadka Tsuruga → Hokuriku Shinkansen → Kanazawa (~45 min) | Przesiadka w Tsuruga jest prosta — stacja mała, dwa perony, oznakowane. Macie ~10 min na przejście.
- 10:30 | 🧳 Kanazawa Station — zostawienie bagaży | Coin lockery przy wschodnim wyjściu (East Exit). Duże szafki ~700 ¥. Albo baggage storage w pobliżu.
- 10:45 | 🚌 Autobus do Kenroku-en (~15 min) | Kanazawa Loop Bus z przystanku #7 (East Exit), 200 ¥. Albo Kenrokuen Shuttle z przystanku #6.
- 11:00 | 🏯 Kenroku-en + Kanazawa Castle | Jeden z trzech najpiękniejszych ogrodów Japonii. Stawy, latarnie, herbaciarnie, widoki. Obok Zamek Kanazawa — wolny wstęp do parku. Kenroku-en wstęp: 320 ¥/os. Spokojny spacer: ~1.5h. | Kenrokuen Garden, Kanazawa
- 12:30 | 🍣 Lunch: Omicho Market | "Kuchnia Kanazawy" — 10 min spacer od Kenroku-en. Świeże sushi z Morza Japońskiego, donburi z owocami morza, kraby. To jeden z najlepszych rynków rybnych w Japonii. | Omicho Market, Kanazawa
- 13:30 | 🚌 Powrót na stację + odbiór bagaży | Autobus lub spacer (~20 min).
- 14:00 | 🚗 Odbiór samochodu — Toyota Rent a Car (Kanazawa Eki Nishiguchi) | Zachodnie wyjście stacji (West Exit), budynek TRL na parterze. Formalności: ~30 min (IDP + paszport + karta). Ustaw nawigację na japońsku (albo Google Maps — działa świetnie).
- 14:30 | 🚗 Kanazawa → Shirakawa-go (~1h autostrady) | Hokuriku Expressway → Tokai-Hokuriku Expressway. Piękna trasa przez góry. ETC card na bramkach.
- 15:30 | 🏘️ Shirakawa-go | UNESCO — wioska z domami gassho-zukuri (strome dachy jak dłonie do modlitwy). Wejdźcie na punkt widokowy Ogimachi Observatory (~10 min pod górę) — widok na całą wioskę. Spacer po wiosce, spróbujcie gohei-mochi (grillowany ryż z miso). Parking: Seseragi (~1 000 ¥). Czas w wiosce: ~1.5–2h. | Shirakawa-go
- 17:30 | 🚗 Shirakawa-go → Takayama (~50 min) | Malownicza droga przez góry. Droga się kręci ale jest dobra.
- 18:30 | 🏨 Check-in WAT Hotel, Takayama | Rozgośćcie się. Zostawcie walizki.
- 19:00 | 🥩 Kolacja: wołowina Hida! | Specjalność Takayamy — marmurkowa wołowina Hida na grilu. Restauracje przy starym mieście (Sanmachi). To jeden z kulinarnych highlightów całej podróży.
- 20:30 | ♨️ Prywatny onsen na dachu WAT Hotel | Rooftop onsen z widokiem na góry. Idealny sposób na zakończenie dnia po podróży. Onsen etykieta: wchodzicie nago, najpierw prysznic, potem moczenie.
- 21:30 | 🏨 Dobranoc | Jutro spokojny dzień w Takayamie.

== Dzień 7 | czw 06.08 | Takayama + Hida no Sato | WAT Hotel, Takayama
Spokojny dzień po wczorajszym maratonie. Poranny targ, stare miasto, Hida no Sato samochodem. Wieczór: onsen.
- 8:00 | 🍳 Śniadanie w hotelu WAT | Spokojne wstawanie. Japońskie śniadanie w hotelu.
- 9:00 | 🛒 Poranny targ (Miyagawa Morning Market) | Nad rzeką Miyagawa, 10 min spacer od hotelu. Stoiska z lokalnymi warzywami, kiszonkami, miso, rękodziełem. Działa codziennie 7:00–12:00. Spróbujcie mitarashi dango (grillowane kulki ryżowe z sosem sojowym). | Miyagawa Morning Market, Takayama
- 10:00 | 🏮 Stare miasto (Sanmachi Suji) | Trzy równoległe uliczki z drewnianymi domami, browary sake, sklepy z rękodziełem. Spokojny spacer — degustacja sake (małe kubeczki za ~200–300 ¥). Tu jest kwintesencja Takayamy. | Sanmachi Suji, Takayama
- 11:30 | 🏘️ OPCJA A: Hida no Sato (Hida Folk Village) | Przejazd ~10 min autem (parking 300 ¥). Skansen z 30+ tradycyjnymi domami z regionu Hida, w tym gassho-zukuri (jak w Shirakawa-go). Pokazy rękodzieła: tkactwo, rzeźba w drewnie, ceramika (10:00–15:00). Wstęp: 700 ¥/dorosły, 100 ¥/nastolatek. Wokół staw, las, spokój. Czas: ~1.5–2h. UWAGA: gassho-zukuri widzieliście już wczoraj w Shirakawa-go (D6) — jeśli nie chcecie powtórki, weźcie OPCJĘ B. | Hida no Sato, Takayama
- 11:30 | ☕ OPCJA B: leniwy poranek w Takayamie | Jeśli macie dość gassho-zukuri po Shirakawa-go (D6) — zostańcie w mieście. Kawa, drugie kółko po targu i Sanmachi, degustacja sake, odpoczynek. Jutro Kamikōchi i wczesna pobudka — warto naładować baterie.
- 13:30 | 🚗 Powrót do miasta (~10 min, tylko OPCJA A) |
- 13:45 | 🍜 Lunch: Takayama ramen lub soba | Takayama ramen (chuka soba) to lokalna specjalność — lekki bulion sojowy, kręcone noodle. Bardzo inny od tokijskiego ramenu. Popularne miejsce: Masagosobaten lub Nakatsubo.
- 14:30 | 🏨 Hotel — odpoczynek / drzemka | Spokojne popołudnie. Odpoczywajcie, czytajcie, śpijcie. Po wczorajszym dniu jest na to czas i zasługa.
- 16:30 | ☕ Kawa + spacer bez planu | Kawiarnia w starym mieście lub nad rzeką. Takayama wieczorem jest spokojna i piękna. Możecie zajrzeć do Takayama Jinya (dawny urząd prefekturalny — drewniany budynek z Edo, wstęp 440 ¥).
- 18:00 | 🍽️ Kolacja | Hoba miso (miso grillowane na liściu magnolii z warzywami i mięsem) — kolejna lokalna specjalność. Albo izakaya z lokalnym sake.
- 19:30 | ♨️ Prywatny onsen na dachu WAT Hotel | Drugi wieczór w onsenie. Tym razem bez stresu po podróży — czysta relaksacja z widokiem na góry.
- 21:00 | 🏨 Dobranoc | Jutro Kamikōchi — trzeba wstać wcześnie!

== Dzień 8 | pt 07.08 | Kamikōchi | WAT Hotel, Takayama
Górska wyprawa do doliny Kamikōchi — Alpy Japońskie na 1500 m n.p.m. Płaski szlak wzdłuż rzeki Azusa, mosty, stawy, widoki na szczyty 3000 m. Wstać wcześnie! 🎌 TŁOK: to piątek TUŻ PRZED długim weekendem (sob 08 – wt 11.08, Dzień Gór) — główna fala krajowych wyjazdów rusza dopiero w sobotę rano, więc dziś jest jeszcze przed szczytem. Kamikōchi latem i tak bywa zatłoczone (popularny cel + parking Hirayu pełny po 9:00), dlatego wczesny start z planu trzymajcie — ale bardziej z powodu parkingu i burz niż samego Obon.
- 6:30 | 🍳 Wczesne śniadanie w hotelu | Dziś jedyny dzień kiedy musicie wstać wcześnie — na parkingu Hirayu robi się tłoczno po 9:00.
- 7:00 | 🚗 Takayama → parking Hirayu Akandana (~40 min) | Trasa 158, droga górska ale dobra. Parking 600 ¥/dzień. Samochody NIE wjeżdżają do Kamikōchi — zostawiamy auto i przesiadamy się na autobus.
- 7:45 | 🚌 Autobus Hirayu → Kamikōchi (~30 min) | Bilet w kasie na parkingu, ~1 300 ¥/os. w jedną stronę (2 600 ¥ tam-powrót). Bez rezerwacji — wsiadacie i jedziecie. Autobusy co 20–30 min.
- 8:15 | 🏔️ Wysiadka na przystanku Taisho Pond | Pro tip: wysiadźcie TUTAJ (1 przystanek przed terminalem), a nie na Bus Terminal. Dzięki temu idziecie Taisho Pond → Kappa Bridge w jednym kierunku, bez wracania.
- 8:20 | 🌲 Taisho Pond (Taisho-ike) | Staw powstały po erupcji wulkanu w 1915. Martwe drzewa wystające z wody, w tle dymiący wulkan Yake-dake i szczyty Hotaka. Magiczny widok rano gdy mgła unosi się nad wodą. | Taisho Pond, Kamikochi
- 8:45 | 🚶 Szlak: Taisho Pond → Tashiro Pond → Kappa Bridge (~70 min, 3.7 km) | Płaski teren wzdłuż rzeki Azusa. Drewniane kładki, las brzozowy i modrzewiowy, bagna. Turkusowa woda w rzece. Temperatura ok. 20–25°C — cudowna ulga po upałach na nizinach!
- 10:00 | 🌉 Kappa Bridge (Most Kappa) | Ikona Kamikōchi — drewniany most wiszący z widokiem na szczyty Hotaka (3190 m). Najsłynniejszy widok w Alpach Japońskich. Zdjęcia obowiązkowe! Wokół mostu: toalety, sklepy, restauracje, centrum informacji. | Kappa Bridge, Kamikochi
- 10:15 | 🚶 Kappa Bridge → Myojin Pond (~60 min, 3 km) | Dalej w górę rzeki — tu jest ciszej, mniej ludzi. Las, kładki, czasem makaki (japońskie małpy). Szlak oznakowany, nie da się zgubić.
- 11:15 | ⛩️ Myojin Pond (Myojin-ike) | "Staw, w którym mieszka bóg" — kryształowo czysta woda z odbiciem gór. Mała świątynia (Hotaka Shrine), brama torii. Wstęp na teren stawu: 500 ¥. Cisza, spokój, koniec szlaku. | Myojin Pond, Kamikochi
- 11:45 | 🍜 Lunch przy Myojin: Kamonjigoya Lodge | Historyczna schronisko/restauracja przy stawie. Grillowany pstrąg (iwana), soba, curry. Jedzenie w górach smakuje inaczej!
- 12:30 | 🚶 Powrót: Myojin → Kappa Bridge → Bus Terminal (~70 min) | Wracajcie drugą stroną rzeki (prawy brzeg) — inne widoki niż w drodze tam. Monument Westona po drodze (Anglik, który "odkrył" Alpy Japońskie). ⛈️ POGODA: latem burze popołudniowe w Kamikōchi są regularne "jak w zegarku" — miejcie lekkie peleryny/kurtki przeciwdeszczowe w plecaku. Przy niepewnej pogodzie skróćcie trasę i zawróćcie już przy Kappa Bridge (i tak ikoniczny widok) zamiast schodzić aż z Myojin.
- 13:45 | 🚌 Autobus Kamikōchi Bus Terminal → Hirayu (~30 min) | Nie czekajcie do późnego popołudnia — kolejki na autobus rosną. Wyjazd ok. 14:00 to sweet spot.
- 14:30 | ♨️ OPCJA: Hirayu Onsen | Na parkingu Hirayu jest publiczny onsen — gorące źródła po spacerze w górach! Szybka kąpiel ~30 min, ~600 ¥. Idealne po 5h chodzenia. | Hirayu Onsen
- 15:30 | 🚗 Hirayu → Takayama (~40 min) | Powrót tą samą trasą.
- 16:15 | 🏨 Hotel WAT — odpoczynek | Nogi będą zmęczone. Leżenie, prysznic.
- 18:00 | 🍽️ Kolacja w Takayamie | Ostatni wieczór tu — wróćcie do ulubionego miejsca na starym mieście albo spróbujcie czegoś nowego. Hoba miso jeśli nie jedliście wczoraj.
- 19:30 | ♨️ Onsen na dachu WAT Hotel | Trzeci i ostatni wieczór w onsenie. Pożegnanie z Takayamą.
- 21:00 | 🏨 Dobranoc | Jutro spokojny przejazd do Nagano przez Matsumoto.

== Dzień 9 | sob 08.08 | Matsumoto → Nagano | Nagano Home, Nagano
Spokojny dzień przejazdowy. Takayama → Matsumoto (~1h autem), Zamek Kruka, lunch, → Nagano (~1h). Nowa baza na 4 noce. 🎌 TŁOK: 08.08 to szczytowy dzień krajowych wyjazdów (start okna Obon) — Zamek Matsumoto będzie miał długie kolejki, kupcie bilet online wcześniej i wejdźcie na otwarcie (8:30).
- 8:00 | 🍳 Śniadanie w hotelu WAT | Ostatnie śniadanie w Takayamie. Spakujcie się, wymeldowanie.
- 9:00 | 🚗 Takayama → Matsumoto (~1h) | Trasa 158 przez Alpy — malownicza droga przez tunel Abo i przełęcze. Przejeżdżacie obok wjazdu do Kamikōchi (wczorajsze wspomnienia!). Droga dobra, ale kręta — spokojnie jedźcie.
- 10:00 | 🅿️ Parking w centrum Matsumoto | Parkingi miejskie przy zamku ~300 ¥/h. Albo parking "Matsumoto City" przy zamku (~500 ¥ za całość).
- 10:15 | 🏯 Zamek Matsumoto (Zamek Kruka) | Jeden z 5 zamków-skarbów narodowych Japonii — oryginał z XVI w., nigdy nie odbudowywany! Czarna fasada odbita w fosie to ikoniczny widok. Wejście do środka: strome drewniane schody (140 stopni, kąt do 61°!), zbroje, broń, widok z 6. piętra na Alpy. Wstęp: 1 200 ¥ online / 1 300 ¥ na miejscu. Czas: ~1–1.5h. Zdejmujecie buty — dostajecie torebkę. | Matsumoto Castle
- 11:45 | 🐸 Nawate Dori (Frog Street) | 3 min od zamku. Uliczka z małymi sklepami wzdłuż strumienia. Motyw przewodni: żaby (kaeru = "kupować" i "wracać"). Pamiątki, słodycze, antyki. Fajne dla syna. | Nawate Dori, Matsumoto
- 12:15 | 🍜 Lunch w Matsumoto | Soba (gryczane kręgle) to specjalność Nagano — Matsumoto ma świetne restauracje soba. Albo shinshu salmon donburi. Nawate Dori i okolice mają dużo opcji.
- 13:00 | 🚗 Matsumoto → Nagano (~1h) | Autostrada Nagano Expressway. Prosta, szybka trasa. ETC card na bramkach.
- 14:00 | 🏨 Check-in Nagano Home | Nowa baza na 4 noce! Rozgośćcie się, rozpakujcie.
- 15:00 | ☕ Spacer po okolicy / odpoczynek | Nagano to spokojne miasto. Możecie odpocząć albo spacerować — bez planu. Konbini na zapasy.
- 17:00 | 🛍️ Monzen-machi (ulica do Zenkō-ji) | Ulica prowadząca do świątyni Zenkō-ji — pełna sklepów, restauracji, kawiarni. Warto przejść się wieczorem, nawet jeśli samą świątynię zostawiacie na inny dzień.
- 18:30 | 🍽️ Kolacja w Nagano | Oyaki (pieczone pierożki z warzywami — specjalność Nagano!), shinshu soba, albo izakaya z lokalnym sake. Pierwszy wieczór w nowym mieście.
- 20:30 | 🏨 Hotel | Spokojny wieczór. Jutro Togakushi — autem przez góry.

== Dzień 10 | nd 09.08 | Togakushi | Nagano Home, Nagano
Aleja 400-letnich cedrów, górzka świątynia, najlepsza soba w Japonii. Spokojny dzień w górskim lesie. Autem ~45 min z Nagano.
- 8:00 | 🍳 Śniadanie w drodze | Brak śniadań w Nagano Home. Zróbcie zapasy wieczorem w konbini (onigiri, kanapki, kawa) albo zatrzymajcie się na kawę i tosty w sieci kawiarni po drodze (np. Komeda Coffee przy trasie — klasyk japoński).
- 8:45 | 🚗 Nagano → Togakushi (~45 min) | Droga 406 przez góry — kręta ale malownicza. Jedźcie prosto do parkingu przy Okusha (górna świątynia). Parking bezpłatny przy wejściu na szlak do Okusha.
- 9:30 | 🚶 Szlak do Okusha (Górna Świątynia) | 2 km w jedną stronę, ~30 min w górę. Pierwszy kilometr — szeroka ścieżka przez las. Po drodze brama Zuishinmon z trawiastym dachem.
- 9:45 | 🌲 Aleja cedrów (Cedar Avenue) | Tu jest magia Togakushi! Za bramą Zuishinmon — aleja ponad 200 cedrów, wiele z nich ma 400+ lat. Gigantyczne pnie po obu stronach ścieżki, cisza, zapach żywicy. Jeden z najpiękniejszych widoków natury w Japonii. Wolny spacer, zdjęcia, oddychanie. | Togakushi Shrine Okusha Cedar Avenue
- 10:15 | ⛩️ Okusha + Kuzuryusha | Na końcu alei strome kamienne schody i dwie świątynie u podnóża klifu góry Togakushi. Okusha (bóg siły) + Kuzuryusha (dziewięciogłowy smok). Mistyczne miejsce — skała wisi nad głową. Chwila ciszy.
- 10:45 | 🚶 Powrót tą samą alejq (~25 min) | W drodze powrotnej aleja wygląda inaczej — inne światło, inna perspektywa.
- 11:15 | 🚗 Przejazd do Chusha (Środkowa Świątynia, ~5 min autem) | Albo 30 min spacer lasem jeśli macie siły.
- 11:30 | ⛩️ Chusha (Środkowa Świątynia) | 800-letnie cedry przy bramie torii! Bóg mądrości — uczniowie modlą się tu przed egzaminami. Mniejsza, spokojniejsza, piękna. | Togakushi Shrine Chusha
- 12:00 | 🍜 LUNCH: Togakushi soba! | Togakushi jest jednym z trzech najsłynniejszych regionów soba w Japonii. Restauracje soba są skupione wokół Chusha — podają ręcznie robione kręgle z lokalnej mąki gryczanej. Musicie spróbować "boccchi" soba (podawanej na okrągłych koszyczkach bambusowych). To kulinarny highlight dnia.
- 13:00 | 🪞 OPCJA A: Kagami-ike (Mirror Pond) | 15 min od Chusha. Staw, w którym odbijają się szczyty Togakushi. Najlepszy w bezwietrzny poranek, ale i popołudniu robi wrażenie. Krótki spacer wokół (~20 min). | Kagamiike Pond, Togakushi
- 13:00 | 🥷 OPCJA B: Chibikko Ninja Village | Jeśli syn ma dość świątyń — park ninja dla rodzin, 5 min od Chusha. Tory linowe, ścianki wspinaczkowe, rzut shuriken. Wstęp ~500 ¥. Sezonowy (otwarty latem).
- 14:00 | 🚗 Powrót do Nagano (~45 min) | Spokojny przejazd w dół. Zrobiłiście sporo, ale nic nie było forsowne.
- 15:00 | 🏨 Nagano Home — odpoczynek | Relaks, pranie (jeśli jest pralka — przyda się w połowie podróży!), planowanie.
- 16:30 | 🛍️ Zakupy / spacer po Nagano | Konbini na zapasy na śniadanie. Albo MIDORI przy stacji Nagano — centrum handlowe z lokalnymi produktami i jedzeniem.
- 18:00 | 🍽️ Kolacja | Oyaki (grillowane pierożki z nadzieniem warzywnym — specjalność Nagano). Albo shinshu soba w mieście. Albo izakaya z lokalnym sake i tempurą.
- 20:30 | 🏨 Hotel | Jutro Snow Monkey Park + Obuse.

== Dzień 11 | pon 10.08 | Snow Monkey Park + Obuse | Nagano Home, Nagano
Rano małpy w Jigokudani, popołudniu miasteczko sztuki Obuse (kasztany + Hokusai). Oba autem, po drodze między sobą. 🎌 TŁOK: szczyt ruchu krajowego (długi weekend + Dzień Gór 11.08) — wczesny start na Snow Monkey jest kluczowy, park otwiera się 8:30 i rano jest najspokojniej.
- 8:00 | 🍳 Śniadanie z zapasów / konbini po drodze | Wyjazd wcześniej — latem park otwiera się o 8:30 i rano jest najspokojniej.
- 8:15 | 🚗 Nagano → parking Jigokudani (~45 min) | Jedźcie w kierunku Yudanaka/Shibu Onsen. Latem jest otwarty prywatny parking bliżej wejścia (~500 ¥) — skraca spacer do 10–15 min. Darmowy parking dalej = 30 min spaceru.
- 9:00 | 🐒 Spacer do Jigokudani Monkey Park (~15 min) | Ścieżka przez las wzdłuż rzeki. Latem łatwa i przyjemna — zielony las, chłodniej niż w mieście. Wstęp: 800 ¥/dorosły, 400 ¥/dziecko. | Jigokudani Monkey Park
- 9:15 | 🐒 Snow Monkey Park | Latem małpy NIE kąpią się w onsenie (za ciepło). Ale są tu cały rok — bawią się w wodzie, skaczą po skałach, małe makaqi jeżdżą na mamach. Podchodzą bardzo blisko — przyzwyczajone do ludzi. Nie dotykajcie i nie karmcie! Latem mniej turystów = spokojniejsza obserwacja. Czas w parku: ~45 min–1h (latem wystarczy).
- 10:15 | 🚶 Powrót do parkingu (~15 min) |
- 10:30 | ♨️ OPCJA: Shibu Onsen (10 min autem) | Historyczne miasteczko onsenowe z 9 publicznymi łaźniami. Można wejść do jednej (~500 ¥). Uliczki z ryokanami, ludzie w yukatach — klimat jak z anime "Spirited Away" (Chihiro). Szybki spacer: ~30 min. | Shibu Onsen
- 11:15 | 🚗 Jigokudani → Obuse (~30 min) | Obuse jest po drodze w stronę Nagano.
- 11:45 | 🎨 Obuse — miasteczko sztuki i kasztanów | Małe, urocze miasteczko znane z dwóch rzeczy: kasztanów i malarza Hokusaia (tego od "Wielkiej Fali").
- 12:00 | 🍜 Lunch: kasztanowe specjały! | Obuse jest stolicą kasztanów w Japonii. Spróbujcie: kurigohan (ryż z kasztanami), kuri okowa, albo Mont Blanc (deser kasztanowy). Restauracje: Obuse-do lub Sakuraikohjien.
- 13:00 | 🖼️ Hokusai Museum | Katsushika Hokusai (autor "Wielkiej Fali") spędził tu ostatnie lata życia. Małe, świetne muzeum z jego drzeworytami. Wstęp: ~1 000 ¥. Czas: ~45 min. | Hokusai Museum, Obuse
- 13:45 | 🏮 Spacer po Obuse | Uliczki z galeriami, sklepami z kasztanowymi słodyczami, browarami sake. Masuichi — 200-letni browar z degustacją sake i biblioteką. Otwarte sklepiki w odnowionych magazynach (kura).
- 14:30 | 🍰 Deser: kasztanowy Mont Blanc lub soft cream | Nie wyjeżdżajcie z Obuse bez deseru kasztanowego! Obuse-do i Sakuraikohjien mają najlepsze.

<div class="hdr">
  <h1>🇯🇵 Japonia 2026</h1>
  <div class="jp">旅行プラン</div>

</div>
<div class="tabs">
  <div class="tab on" onclick="sw(0)">📋 Rezerwacje</div>
  <div class="tab" onclick="sw(1)">🗾 Plan dzień po dniu</div>
  <div class="tab" onclick="sw(2)">📊 Dystanse</div>
</div>

<div class="pnl" id="p1"></div>
<div class="pnl" id="p2"></div>
<div class="ft" id="footer"></div>

<script>
function sw(i){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j===i));document.querySelectorAll('.pnl').forEach((p,j)=>p.classList.toggle('on',j===i))}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function uc(u){const l=u.toLowerCase();if(l==='teraz')return{bl:'bl-r',bdg:'bdg-now',lb:'Teraz'};if(l==='czerwiec')return{bl:'bl-g',bdg:'bdg-soon',lb:'Czerwiec'};if(l==='lipiec')return{bl:'bl-t',bdg:'bdg-july',lb:'Lipiec'};return{bl:'bl-n',bdg:'bdg-none',lb:u}}
function pc(t){const l=t.toLowerCase();if(l.includes('kioto')||l.includes('osaka')||l.includes('nara'))return'1';if(l.includes('alpy')||l.includes('nagano'))return'2';return'3'}

function parse(text){
  const lines=text.split('\n'),meta={},res=[],parts=[];
  let sec='',cp=null,cd=null;
  for(const raw of lines){
    const t=raw.trim();
    if(t.startsWith('### ')){sec=t.slice(4).trim();continue}
    if(sec==='META'){const m=t.match(/^(\w+):\s*(.+)$/);if(m)meta[m[1]]=m[2];continue}
    if(sec==='REZERWACJE'){if(!t||t.startsWith('#'))continue;const p=t.split(' | ');if(p.length>=4)res.push({ti:p[0].trim(),ur:p[1].trim(),dt:p[2].trim(),dx:p[3].trim()});continue}
    if(sec==='PLAN'){
      if(t.startsWith('# ')){cp={title:t.slice(2).trim(),days:[]};parts.push(cp);cd=null;continue}
      if(t.startsWith('== ')){const p=t.slice(3).split(' | ');cd={lb:p[0]||'',ds:p[1]||'',ts:p[2]||'',ht:p[3]||'',sm:'',sc:[]};if(cp)cp.days.push(cd);continue}
      if(t.startsWith('- ')&&cd){const p=t.slice(2).split(' | ');cd.sc.push({tm:p[0]||'',ti:p[1]||'',nt:p[2]||'',mq:(p[3]||'').trim()});continue}
      if(t&&cd&&!t.startsWith('#')&&!t.startsWith('==')){cd.sm+=(cd.sm?' ':'')+t;continue}
    }
  }
  return{meta,res,parts}
}

const D=parse(PLAN_DATA);
document.getElementById('subtitle').textContent=D.meta.subtitle||'';
document.getElementById('footer').innerHTML=`日本旅行 2026 · Ostatnia aktualizacja: ${esc(D.meta.updated||'?')}<br><span style="font-size:.9em;opacity:.7">Kursywa = dni do rozpisania</span>`;

// Render reservations with checkboxes + confirmation links (localStorage)
function getResState(){try{return JSON.parse(localStorage.getItem('jp26_res')||'{}')}catch(e){return{}}}
function saveResState(s){localStorage.setItem('jp26_res',JSON.stringify(s))}
function toggleRes(i){const s=getResState();s[i]=s[i]||{};s[i].done=!s[i].done;saveResState(s);renderAllRes()}
function addLink(i){const url=prompt('Wklej link do potwierdzenia:');if(url&&url.trim()){const s=getResState();s[i]=s[i]||{};s[i].link=url.trim();saveResState(s);renderAllRes()}}
function removeLink(i){const s=getResState();if(s[i])s[i].link='';saveResState(s);renderAllRes()}

function fmtRx(s){
  let t=esc(s);
  // Section headers: ▸ MUST HAVE: etc
  t=t.replace(/▸\s*([^:]+):/g,'<div class="rx-section">▸ $1:</div>');
  // Numbered items: ① ② etc - each on its own line
  t=t.replace(/([①②③④⑤⑥⑦⑧⑨⑩⑪⑫])\s*/g,'<div class="rx-item">$1 ');
  // Close items (before next item or section or end)
  const parts=t.split('<div class="rx-item">');
  if(parts.length>1){
    t=parts[0];
    for(let i=1;i<parts.length;i++){t+='<div class="rx-item">'+parts[i]+'</div>';}
  }
  return t;
}

function renderAllRes(){
  const s=getResState();
  let h0='<div class="sl">Do załatwienia przed wyjazdem</div>';
  D.res.forEach((r,i)=>{
    const u=uc(r.ur);
    const st=s[i]||{};
    const done=st.done;
    const link=st.link;
    const doneClass=done?'rc-done':'';
    h0+=`<div class="rc ${u.bl} ${doneClass}">`;
    h0+=`<div class="rh"><label class="chk-wrap"><input type="checkbox" ${done?'checked':''} onchange="toggleRes(${i})"><span class="chk-box"></span></label><span class="rt">${esc(r.ti)}</span><span class="bdg ${done?'bdg-done':u.bdg}">${done?'✓ Gotowe':esc(u.lb)}</span></div>`;
    h0+=`<div class="rd">${esc(r.dt)}</div>`;
    h0+=`<div class="rx">${fmtRx(r.dx)}</div>`;
    if(link){h0+=`<div class="rc-link"><a href="${esc(link)}" target="_blank" rel="noopener">📎 Potwierdzenie</a><button class="link-rm" onclick="removeLink(${i})">✕</button></div>`}
    h0+=`<div class="rc-actions"><button class="link-btn" onclick="addLink(${i})">${link?'🔄 Zmień link':'📎 Dodaj link potwierdzenia'}</button></div>`;
    h0+=`</div>`;
  });
  document.getElementById('p0').innerHTML=h0;
}
renderAllRes();

// Render plan
let h1='';
D.parts.forEach(part=>{
  const c=pc(part.title);
  h1+=`<div class="pdiv"><div class="ln bg${c}"></div><div class="lb c${c}">${esc(part.title)}</div><div class="ln bg${c}"></div></div>`;
  part.days.forEach(d=>{
    const has=d.sc.length>0,tbd=has?'':'tbd',label=d.ts?d.lb+' · '+d.ts:d.lb;
    h1+=`<div class="dc"><div class="dh bg${c}"><span class="dn">${esc(label)}</span><span class="dd">${esc(d.ds)}</span></div><div class="db ${tbd}"><div class="ds">${esc(d.sm)}</div>`;
    const wp=d.sc.filter(s=>s.mq).map(s=>s.mq);
    if(wp.length>=2){const url='https://www.google.com/maps/dir/'+wp.map(encodeURIComponent).join('/');h1+=`<a class="route-btn" href="${url}" target="_blank" rel="noopener">🗺️ Zobacz trasę dnia w Google Maps</a>`}
    else if(wp.length===1){const url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(wp[0]);h1+=`<a class="route-btn" href="${url}" target="_blank" rel="noopener">🗺️ Zobacz na mapie</a>`}
    if(has){h1+='<div class="sch">';d.sc.forEach(s=>{const ti=s.mq?`<a class="mlink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.mq)}" target="_blank" rel="noopener">${esc(s.ti)}</a>`:esc(s.ti);h1+=`<div class="sr"><div class="st">${esc(s.tm)}</div><div class="sc"><strong>${ti}</strong>${s.nt?'<br><span class="n">'+esc(s.nt)+'</span>':''}</div></div>`});h1+='</div>'}
    h1+=`<div class="dht">🏨 ${esc(d.ht)}</div></div></div>`;
  });
});
document.getElementById('p1').innerHTML=h1;

// Render stats tab
const DAYS=[
{d:1,n:'Przylot + Gion',walk:4,metro:0,car:0,train:75,part:1},
{d:2,n:'Kiyomizu + Fushimi nocą',walk:14,metro:10,car:0,train:0,part:1},
{d:3,n:'Osaka',walk:15,metro:40,car:0,train:100,part:1},
{d:4,n:'Arashiyama + Kinkaku-ji (+teamLab?)',walk:13,metro:80,car:0,train:0,part:1},
{d:5,n:'Uji + Nara',walk:13,metro:0,car:0,train:110,part:1},
{d:6,n:'Kanazawa → Takayama',walk:6,metro:20,car:140,train:105,part:2},
{d:7,n:'Takayama + Hida',walk:6,metro:0,car:10,train:0,part:2},
{d:8,n:'Kamikōchi',walk:14,metro:0,car:80,train:0,part:2},
{d:9,n:'Matsumoto → Nagano',walk:5,metro:0,car:160,train:0,part:2},
{d:10,n:'Togakushi',walk:8,metro:0,car:90,train:0,part:2},
{d:11,n:'Snow Monkey + Obuse',walk:6,metro:0,car:80,train:0,part:2},
{d:12,n:'Zenkō-ji',walk:6,metro:0,car:0,train:0,part:2},
{d:13,n:'Nagano → Tokio',walk:7,metro:30,car:0,train:80,part:3},
{d:14,n:'teamLab + Asakusa',walk:12,metro:60,car:0,train:0,part:3},
{d:15,n:'Akiba + Samurai + Shinjuku',walk:13,metro:30,car:0,train:0,part:3},
{d:16,n:'Meiji Jingu + Shibuya',walk:12.5,metro:20,car:0,train:0,part:3},
{d:17,n:'Yanaka + Ueno',walk:11,metro:15,car:0,train:0,part:3},
{d:18,n:'Zakupy',walk:7,metro:30,car:0,train:0,part:3},
{d:19,n:'Kamakura + Enoshima',walk:14,metro:0,car:0,train:150,part:3},
{d:20,n:'Lot powrotny',walk:3,metro:0,car:0,train:40,part:3}
];
const totalWalk=DAYS.reduce((s,d)=>s+d.walk,0);
const totalCar=DAYS.reduce((s,d)=>s+d.car,0);
const totalTrain=DAYS.reduce((s,d)=>s+d.train,0);
const avgWalk=Math.round(totalWalk/DAYS.length*10)/10;
const maxWalk=Math.max(...DAYS.map(d=>d.walk));
const maxDay=DAYS.find(d=>d.walk===maxWalk);

const partNames={1:'Kioto / Osaka / Nara',2:'Alpy / Nagano',3:'Tokio'};
const partColors={1:'var(--red)',2:'var(--teal)',3:'var(--indigo)'};

let h2='<div class="stats-grid">';
h2+=`<div class="stat-card"><div class="stat-label">Łącznie pieszo</div><div class="stat-val teal">${Math.round(totalWalk)} km</div></div>`;
h2+=`<div class="stat-card"><div class="stat-label">Średnio dziennie</div><div class="stat-val indigo">${avgWalk} km</div></div>`;
h2+=`<div class="stat-card"><div class="stat-label">Max dzień (D${maxDay.d})</div><div class="stat-val red">${maxWalk} km</div></div>`;
h2+=`<div class="stat-card"><div class="stat-label">Autem łącznie</div><div class="stat-val gold">${totalCar} km</div></div>`;
h2+='</div>';

h2+='<div class="chart-wrap"><canvas id="statsChart"></canvas></div>';
h2+='<div class="legend-row"><span><span class="legend-dot" style="background:#1D9E75"></span> pieszo (km)</span><span><span class="legend-dot" style="background:#EF9F27;width:10px;height:2px;border-radius:0"></span> 12+ km (dużo)</span><span><span class="legend-dot" style="background:#E24B4A;width:10px;height:2px;border-radius:0"></span> 15+ km (bardzo dużo)</span></div>';

h2+='<div class="sl" style="margin-top:28px">Szczegóły dzień po dniu</div>';
h2+='<table class="dist-tbl"><thead><tr><th>Dzień</th><th>Miejsce</th><th class="r">Pieszo</th><th class="r">Metro/bus</th><th class="r">Auto</th><th class="r">Pociąg</th></tr></thead><tbody>';

let lastPart=0;
DAYS.forEach(d=>{
  if(d.part!==lastPart){
    lastPart=d.part;
    h2+=`<tr class="part-row"><td colspan="6">${esc(partNames[d.part])}</td></tr>`;
  }
  const cls=d.walk>=15?'km-hi':d.walk>=12?'km-mid':'';
  h2+=`<tr${d.walk>=14?' class="warn"':''}><td>${d.d}</td><td>${esc(d.n)}</td><td class="r ${cls}">${d.walk} km</td><td class="r">${d.metro?d.metro+' min':'—'}</td><td class="r">${d.car?d.car+' km':'—'}</td><td class="r">${d.train?d.train+' min':'—'}</td></tr>`;
});
h2+=`<tr style="border-top:2px solid var(--border);font-weight:700"><td colspan="2">RAZEM</td><td class="r">${Math.round(totalWalk)} km</td><td class="r">${DAYS.reduce((s,d)=>s+d.metro,0)} min</td><td class="r">${totalCar} km</td><td class="r">${totalTrain} min</td></tr>`;
h2+='</tbody></table>';
document.getElementById('p2').innerHTML=h2;

// Chart
const sc=document.createElement('script');
sc.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js';
sc.onload=function(){
  const ctx=document.getElementById('statsChart');
  if(!ctx)return;
  const walkData=DAYS.map(d=>d.walk);
  const barColors=walkData.map(v=>v>=15?'#E24B4A':v>=12?'#EF9F27':'#1D9E75');
  new Chart(ctx,{
    type:'bar',
    data:{labels:DAYS.map(d=>'D'+d.d),datasets:[{data:walkData,backgroundColor:barColors,borderRadius:4}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        y:{beginAtZero:true,max:20,grid:{color:'rgba(128,128,128,0.1)'},ticks:{callback:v=>v+' km',font:{size:11}}},
        x:{grid:{display:false},ticks:{font:{size:10}}}
      }
    },
    plugins:[{
      id:'lines',
      afterDraw(chart){
        const ctx2=chart.ctx;
        ctx2.save();
        [15,12].forEach((v,i)=>{
          const y=chart.scales.y.getPixelForValue(v);
          ctx2.strokeStyle=i===0?'#E24B4A':'#EF9F27';
          ctx2.lineWidth=1;
          ctx2.setLineDash([6,4]);
          ctx2.beginPath();
          ctx2.moveTo(chart.chartArea.left,y);
          ctx2.lineTo(chart.chartArea.right,y);
          ctx2.stroke();
        });
        ctx2.restore();
      }
    }]
  });
};
document.head.appendChild(sc);
</script>
</body>
</html>
